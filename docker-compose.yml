# ============================================================
# Israel Public Transit Real-Time Monitoring Platform
# Docker Compose - All Services
# ============================================================

networks:
  transit_net:
    driver: bridge

volumes:
  postgres_data:
  airflow_logs:
  minio_data:
  kafka_data:
  zookeeper_data:
  elasticsearch_data:
  pgadmin_data:

services:

  # ─────────────────────────────────────────
  # NETWORK FIX (runs first, sets bridge-nf-call-iptables=0 + masquerade)
  # FIX: After VM reboot Docker's iptables rules can be missing, causing 100%
  #      packet loss between containers on the same bridge. Setting
  #      bridge-nf-call-iptables=0 bypasses iptables for bridge traffic entirely,
  #      restoring inter-container connectivity without needing root sudo.
  # FIX2: Also adds NAT masquerade for container→internet egress traffic.
  #       Without MASQUERADE, containers can reach each other but not external APIs.
  #       The rule: iptables -t nat -A POSTROUTING -s 172.18.0.0/16 ! -o br-a6d4a147d234 -j MASQUERADE
  # NOTE: Producers/indexers can be run from the VM host as a workaround:
  #       cd /home/local_admin/finalproject && venv/bin/python3 storage/direct_to_minio.py
  # ─────────────────────────────────────────
  network-fix:
    image: busybox
    container_name: network-fix
    restart: "no"
    privileged: true
    network_mode: host
    command: ["sh", "-c", "echo 0 > /proc/sys/net/bridge/bridge-nf-call-iptables 2>/dev/null; echo 0 > /proc/sys/net/bridge/bridge-nf-call-ip6tables 2>/dev/null; sysctl -w net.ipv4.ip_forward=1 2>/dev/null; echo bridge-nf-fix-done"]

  # ─────────────────────────────────────────
  # ZOOKEEPER
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: "no"
    networks: [transit_net]
    mem_limit: 256m
    depends_on:
      - network-fix
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # FIX: force IPv4 so Docker bridge (172.18.x.x) works — without this Java prefers
      #      IPv6 (::) and Docker bridge IPv4 routing can fail after VM reboot.
      ZOOKEEPER_SERVER_JVMFLAGS: "-Xmx128m -Xms64m -Djava.net.preferIPv4Stack=true"
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "*"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      # FIX: Use 'srvr' (checks actual server state, not just process liveness).
      #      'ruok' returns 'imok' even during crash-recovery; 'srvr' only responds
      #      when ZK is ready to accept client sessions.
      test: ["CMD-SHELL", "echo srvr | nc -w 3 localhost 2181 | grep -q 'Mode: standalone'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ─────────────────────────────────────────
  # KAFKA BROKER
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: "no"
    networks: [transit_net]
    mem_limit: 512m
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      # JVM heap — default 1GB crashes 8GB VM with all services running
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      # FIX: force IPv4 for ZooKeeper connection — same root cause as ZooKeeper fix above.
      #      Without this, Kafka's cub zk-ready preflight tries IPv6 and times out
      #      because Docker bridge is IPv4-only.
      KAFKA_OPTS: "-Djava.net.preferIPv4Stack=true"
      # FIX: give the cub zk-ready preflight check 3 minutes (default 40s).
      #      After VM reboot ZooKeeper replays its WAL before accepting sessions.
      KAFKA_CUB_ZK_TIMEOUT: 180
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 90000
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 60000
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 10485760
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 10485760
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # FIX: replaced kafka-broker-api-versions (slow — ~5s Java startup each check)
      #      with nc TCP check — instant, no JVM overhead.
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s

  # ─────────────────────────────────────────
  # KAFKA TOPIC INITIALIZER
  # ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    restart: "no"
    networks: [transit_net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 4 --replication-factor 1 --topic bus-positions
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 4 --replication-factor 1 --topic train-positions
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 2 --replication-factor 1 --topic trip-updates
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 2 --replication-factor 1 --topic service-alerts
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 2 --replication-factor 1 --topic traffic-data
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic delay-events
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic pipeline-errors
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic bus-delays
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 3 --replication-factor 1 --topic train-delays
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic bus-delays-historical
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --topic train-delays-historical
      echo 'All transit topics created!'
      "

  # ─────────────────────────────────────────
  # KAFKA UI
  # ─────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: "no"
    networks: [transit_net]
    mem_limit: 256m
    depends_on:
      # FIX: use service_started, not service_healthy — kafka-ui has its own retry logic
      #      and waiting for kafka to be 'healthy' delays startup unnecessarily.
      kafka:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: transit-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      JAVA_OPTS: "-Xmx192m -Xms64m"

  # ─────────────────────────────────────────
  # POSTGRESQL - Airflow metadata + GTFS
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    restart: "no"
    networks: [transit_net]
    mem_limit: 256m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c synchronous_commit=off
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  # ─────────────────────────────────────────
  # MINIO - Local S3 data lake
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: "no"
    networks: [transit_net]
    mem_limit: 384m
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      GOGC: "20"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # AIRFLOW WEBSERVER
  # ─────────────────────────────────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: transit-airflow:latest
    container_name: airflow-webserver
    # FIX: boot-storm — set to "no" to prevent simultaneous restart on VM boot.
    restart: "no"
    init: true
    networks: [transit_net]
    env_file: .env
    mem_limit: 1200m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: transit_secret_2025
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # FIX: parallelism 2→4, max_active_tasks_per_dag 1→3.
      #      With parallelism=2 and max_active=1 the ETL's 5 consumer tasks ran
      #      sequentially (50+ min/run). Now they can run 3 at a time.
      AIRFLOW__CORE__PARALLELISM: '8'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '180'
      AIRFLOW__WEBSERVER__WORKERS: '1'
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '1200'
      # FIX: reparse DAGs every 5 min (was 60s — with 8-min parse files this caused queue buildup)
      AIRFLOW__CORE__MIN_FILE_PROCESS_INTERVAL: '300'
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: '120'
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_FETCH_INTERVAL: '120'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '120'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '1'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: '1800'
      AIRFLOW__WEBSERVER__RELOAD_ON_PLUGIN_CHANGE: 'false'
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: '3600'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MOT_API_KEY: ${MOT_API_KEY}
      HERE_API_KEY: ${HERE_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-israel-transit-lake}
      USE_MINIO: ${USE_MINIO:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./producers:/opt/airflow/producers
      - ./consumers:/opt/airflow/consumers
      - ./etl:/opt/airflow/etl
      - ./config:/opt/airflow/config
      - ./storage:/opt/airflow/storage
      - ./warehouse:/opt/airflow/warehouse
      - ./resilient_pipeline.py:/opt/airflow/resilient_pipeline.py
    ports:
      - "8081:8080"
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@transit.il 2>/dev/null || true && airflow webserver"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  # ─────────────────────────────────────────
  # AIRFLOW SCHEDULER
  # ─────────────────────────────────────────
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: transit-airflow:latest
    container_name: airflow-scheduler
    # FIX: boot-storm — set to "no" to prevent simultaneous restart on VM boot.
    restart: "no"
    init: true
    networks: [transit_net]
    env_file: .env
    # FIX: was 512m — scheduler was at 457/512m (near OOM). Increased to 800m.
    mem_limit: 800m
    depends_on:
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONPATH: /opt/airflow
      # FIX: parallelism and max_active must match webserver values
      AIRFLOW__CORE__PARALLELISM: '8'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
      AIRFLOW__SCHEDULER__MAX_THREADS: '2'
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '180'
      # FIX: reparse DAGs every 5 min — avoids parse-queue buildup on slow-parsing files
      AIRFLOW__CORE__MIN_FILE_PROCESS_INTERVAL: '300'
      AIRFLOW__CORE__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: '120'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: '120'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '2'
      AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '1'
      AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: '1800'
      AIRFLOW__SCHEDULER__JOB_HEARTBEAT_SEC: '30'
      # FIX: was 120s — DAG file parse can take ~8 min, causing heartbeat gap > threshold
      AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: '300'
      AIRFLOW__SCHEDULER__CLEAN_TIS_WITHOUT_DAGRUN_INTERVAL: "60.0"
      AIRFLOW__SCHEDULER__MAX_TIS_PER_QUERY: "8"
      AIRFLOW__SCHEDULER__ORPHANED_TASKS_CHECK_INTERVAL: "300"
      AIRFLOW__CORE__KILLED_TASK_CLEANUP_TIME: "120"
      MOT_API_KEY: ${MOT_API_KEY}
      HERE_API_KEY: ${HERE_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      USE_MINIO: ${USE_MINIO:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./producers:/opt/airflow/producers
      - ./consumers:/opt/airflow/consumers
      - ./etl:/opt/airflow/etl
      - ./config:/opt/airflow/config
      - ./storage:/opt/airflow/storage
      - ./warehouse:/opt/airflow/warehouse
      - ./resilient_pipeline.py:/opt/airflow/resilient_pipeline.py
    command: scheduler

  # ─────────────────────────────────────────
  # ELASTICSEARCH
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: elasticsearch
    restart: "no"
    networks: [transit_net]
    mem_limit: 700m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ─────────────────────────────────────────
  # KIBANA
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: kibana
    restart: "no"
    networks: [transit_net]
    mem_limit: 512m
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=384"

  # ─────────────────────────────────────────
  # PGADMIN - PostgreSQL Web UI
  # http://localhost:5050  |  admin@transit.il / admin
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: "no"
    networks: [transit_net]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transit.il
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
