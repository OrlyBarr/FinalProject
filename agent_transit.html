<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Israel Transit Query Tool 🚌</title>
  <style>
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --accent:   #1f6feb;
      --green:    #3fb950;
      --yellow:   #d29922;
      --orange:   #e3891e;
      --red:      #f85149;
      --cyan:     #39c5cf;
      --text:     #e6edf3;
      --muted:    #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header h1 span { color: var(--accent); }
    #live-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; color: var(--muted);
    }
    #live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Nav tabs */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; gap: 0; overflow-x: auto;
    }
    nav button {
      background: none; border: none; border-bottom: 3px solid transparent;
      color: var(--muted); cursor: pointer;
      padding: 12px 20px; font-size: .9rem; white-space: nowrap;
      transition: color .2s, border-color .2s;
    }
    nav button:hover { color: var(--text); }
    nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Layout */
    main { padding: 24px; max-width: 960px; margin: 0 auto; }
    .tab-panel { display: none; flex-direction: column; gap: 18px; }
    .tab-panel.active { display: flex; }

    /* Search bar */
    .search-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    }
    .search-row .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
    .search-row label { font-size: .78rem; color: var(--muted); }
    .search-row input, .search-row select {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      padding: 9px 12px; font-size: .9rem; outline: none;
      transition: border-color .2s;
    }
    .search-row input:focus, .search-row select:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 9px 20px; cursor: pointer;
      font-size: .9rem; font-weight: 600; white-space: nowrap;
      transition: opacity .2s; align-self: flex-end;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; }

    /* Quick chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 14px; font-size: .8rem;
      cursor: pointer; color: var(--muted); transition: border-color .2s, color .2s;
    }
    .chip:hover { border-color: var(--accent); color: var(--text); }

    /* Loading */
    .loader {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: .9rem; padding: 12px 0;
    }
    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Vehicle cards */
    .v-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .v-card .v-header {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .v-card .line-badge {
      background: var(--accent); color: #fff;
      border-radius: 6px; padding: 2px 10px;
      font-weight: 700; font-size: 1rem;
    }
    .v-card .op-name { color: var(--cyan); font-size: .88rem; }
    .v-card .age     { color: var(--muted); font-size: .78rem; margin-right: auto; }
    .v-card .v-row   { font-size: .85rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
    .v-card .v-row span { color: var(--text); }
    .badge-ok   { color: var(--green); }
    .badge-warn { color: var(--yellow); }
    .badge-bad  { color: var(--orange); }
    .badge-err  { color: var(--red); }

    /* Stops panel inside bus card */
    .stops-toggle {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; color: var(--cyan); cursor: pointer;
      font-size: .78rem; padding: 4px 10px; margin-top: 4px;
      transition: border-color .2s; align-self: flex-start;
    }
    .stops-toggle:hover { border-color: var(--cyan); }
    .stops-panel {
      display: none; margin-top: 8px;
      border-top: 1px solid var(--border); padding-top: 10px;
    }
    .stops-panel.open { display: block; }
    .stop-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 5px 0; border-bottom: 1px solid var(--surface2);
      font-size: .82rem;
    }
    .stop-row:last-child { border-bottom: none; }
    .stop-seq {
      background: var(--surface2); border-radius: 4px;
      padding: 1px 6px; font-size: .75rem; color: var(--muted);
      flex-shrink: 0; min-width: 28px; text-align: center;
    }
    .stop-name { color: var(--text); flex: 1; }
    .stop-time { color: var(--cyan); font-size: .78rem; flex-shrink: 0; }
    .stop-passed { opacity: .4; }

    /* Alert card */
    .alert-card {
      background: var(--surface); border: 1px solid var(--border);
      border-right: 4px solid var(--red); border-radius: 10px;
      padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;
    }
    .alert-card .a-title { font-weight: 600; font-size: .95rem; }
    .alert-card .a-effect { color: var(--orange); font-size: .82rem; }

    /* Train board row */
    .train-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px;
      align-items: center;
    }
    .train-row .tn { font-weight: 700; font-size: 1.05rem; }
    .train-row .route { font-size: .88rem; }
    .train-row .platform {
      background: var(--yellow); color: #000;
      border-radius: 6px; padding: 2px 8px; font-weight: 700; font-size: .85rem;
      text-align: center;
    }
    .train-row .times { font-size: .83rem; color: var(--muted); grid-column: 1/-1; }
    .train-row .times span { color: var(--text); }

    /* Empty / error states */
    .msg-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px; text-align: center;
      color: var(--muted); font-size: .9rem;
    }
    .msg-box.err  { border-color: var(--red);    color: var(--red); }
    .msg-box.warn { border-color: var(--yellow); color: var(--yellow); }
    .msg-box.ok   { border-color: var(--green);  color: var(--green); }

    /* Summary bar */
    .summary { font-size: .82rem; color: var(--muted); padding: 4px 0; }

    /* Station grid */
    .station-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }
    .station-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; cursor: pointer;
      color: var(--text); font-size: .82rem; text-align: right;
      transition: border-color .2s, background .2s;
    }
    .station-btn:hover  { border-color: var(--accent); }
    .station-btn.active { border-color: var(--accent); background: rgba(31,111,235,.15); }
    .station-btn .s-id  { color: var(--cyan); font-weight: 700; font-size: .9rem; }

    /* Lines picker (Tab 2) */
    #lines-picker {
      display: flex; flex-wrap: wrap; gap: 6px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px;
    }
    .line-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 3px 12px; font-size: .82rem;
      cursor: pointer; color: var(--text);
      transition: border-color .2s, background .2s;
    }
    .line-chip:hover { border-color: var(--accent); background: rgba(31,111,235,.12); }

    code { font-family: monospace; font-size: .82rem; }
  </style>
</head>
<body>

<header>
  <h1>🚌 <span>Israel</span> Transit Query Tool</h1>
  <div id="live-badge">
    <div id="live-dot"></div>
    <span id="live-time">--:--:--</span>
  </div>
</header>

<nav>
  <button class="active" data-tab="tab-bus"     onclick="switchTab('tab-bus',this)">📍 ליד כתובת</button>
  <button               data-tab="tab-line"    onclick="switchTab('tab-line',this)">🚌 קו אוטובוס</button>
  <button               data-tab="tab-station" onclick="switchTab('tab-station',this)">🚆 לוח רכבת</button>
  <button               data-tab="tab-train"   onclick="switchTab('tab-train',this)">🔍 עקב רכבת</button>
  <button               data-tab="tab-alerts"  onclick="switchTab('tab-alerts',this)">🔔 התראות</button>
</nav>

<main>

  <!-- ══════════════════════════════════════════════════════
       Tab 1: Buses near address
  ══════════════════════════════════════════════════════ -->
  <div id="tab-bus" class="tab-panel active">
    <div class="search-row">
      <div class="field">
        <label>כתובת (עברית או אנגלית)</label>
        <input id="addr-input" type="text" placeholder="רחוב הרצל 1, תל אביב" />
      </div>
      <div class="field" style="max-width:130px">
        <label>טווח (מטרים)</label>
        <input id="addr-radius" type="number" value="500" min="100" max="3000" step="100" />
      </div>
      <button class="btn" onclick="searchNearAddress()">חיפוש</button>
    </div>
    <div class="chips">
      <span class="chip" onclick="quickAddr('דיזנגוף 50, תל אביב')">📍 דיזנגוף ת"א</span>
      <span class="chip" onclick="quickAddr('כיכר ספרא, ירושלים')">📍 כיכר ספרא</span>
      <span class="chip" onclick="quickAddr('הנמל, חיפה')">📍 נמל חיפה</span>
      <span class="chip" onclick="quickAddr('שדרות בן גוריון, באר שבע')">📍 ב"ג באר שבע</span>
      <span class="chip" onclick="quickAddr('רחוב ויצמן, רחובות')">📍 ויצמן רחובות</span>
    </div>
    <div id="results-bus"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       Tab 2: Track bus line — operator → line picker
  ══════════════════════════════════════════════════════ -->
  <div id="tab-line" class="tab-panel">
    <div class="search-row">
      <div class="field" style="max-width:200px">
        <label>מפעיל</label>
        <select id="line-operator" onchange="loadLinesForOperator()">
          <option value="">בחר מפעיל...</option>
          <option value="3">3 — דן</option>
          <option value="5">5 — אגד</option>
          <option value="6">6 — אגד תעבורה</option>
          <option value="7">7 — קוופרטיב</option>
          <option value="10">10 — מטרופולין</option>
          <option value="14">14 — קווים</option>
          <option value="15">15 — נתיב אקספרס</option>
          <option value="16">16 — ירושלים</option>
          <option value="18">18 — גולן</option>
          <option value="20">20 — Kavim</option>
          <option value="25">25 — נצרת</option>
          <option value="42">42 — Extra</option>
        </select>
      </div>
      <div class="field">
        <label>מספר קו אוטובוס</label>
        <input id="line-input" type="text" placeholder="89" />
      </div>
      <button class="btn" onclick="searchLine()">עקוב</button>
    </div>

    <!-- Line picker: populated when operator is selected -->
    <div id="lines-picker-wrap" style="display:none">
      <div class="summary" id="lines-picker-label"></div>
      <div id="lines-picker"></div>
    </div>

    <div id="results-line"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       Tab 3: Train station board
  ══════════════════════════════════════════════════════ -->
  <div id="tab-station" class="tab-panel">
    <div class="search-row">
      <div class="field" style="max-width:200px">
        <label>מספר תחנה</label>
        <input id="station-input" type="text" placeholder="2300" />
      </div>
      <button class="btn" onclick="searchStation()">לוח יציאות</button>
    </div>
    <div class="station-grid">
      <button class="station-btn" onclick="quickStation('2300')"><div class="s-id">2300</div>תל אביב מרכז</button>
      <button class="station-btn" onclick="quickStation('2820')"><div class="s-id">2820</div>תל אביב השלום</button>
      <button class="station-btn" onclick="quickStation('3400')"><div class="s-id">3400</div>ירושלים נבון</button>
      <button class="station-btn" onclick="quickStation('3600')"><div class="s-id">3600</div>חיפה מרכז שמיר</button>
      <button class="station-btn" onclick="quickStation('3100')"><div class="s-id">3100</div>נתניה</button>
      <button class="station-btn" onclick="quickStation('5000')"><div class="s-id">5000</div>הרצליה</button>
      <button class="station-btn" onclick="quickStation('4600')"><div class="s-id">4600</div>באר שבע מרכז</button>
      <button class="station-btn" onclick="quickStation('1220')"><div class="s-id">1220</div>נהריה</button>
      <button class="station-btn" onclick="quickStation('700')"><div class="s-id">700</div>חדרה מערב</button>
      <button class="station-btn" onclick="quickStation('6700')"><div class="s-id">6700</div>אשקלון</button>
      <button class="station-btn" onclick="quickStation('6900')"><div class="s-id">6900</div>אשדוד עד הלום</button>
      <button class="station-btn" onclick="quickStation('2200')"><div class="s-id">2200</div>בני ברק</button>
    </div>
    <div id="results-station"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       Tab 4: Track train — search by station + optional train number
  ══════════════════════════════════════════════════════ -->
  <div id="tab-train" class="tab-panel">
    <div class="search-row">
      <div class="field" style="max-width:200px">
        <label>מספר רכבת (אופציונלי)</label>
        <input id="train-input" type="text" placeholder="145" />
      </div>
      <button class="btn" onclick="trackTrain()">חפש בכל התחנות</button>
    </div>
    <p style="font-size:.82rem;color:var(--muted)">
      לחץ על תחנה כדי לראות את כל הרכבות העוברות בה. אם הכנסת מספר רכבת — תוצאות יסוננו.
    </p>

    <!-- Station selector -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="summary">בחר תחנה לאיתור הרכבת:</div>
      <div class="station-grid" id="train-station-grid">
        <button class="station-btn" onclick="trackByStation('1500')"><div class="s-id">1500</div>ת"א סבידור מרכז</button>
        <button class="station-btn" onclick="trackByStation('1600')"><div class="s-id">1600</div>ת"א השלום</button>
        <button class="station-btn" onclick="trackByStation('1700')"><div class="s-id">1700</div>ת"א הרכבת</button>
        <button class="station-btn" onclick="trackByStation('2300')"><div class="s-id">2300</div>ת"א מרכז</button>
        <button class="station-btn" onclick="trackByStation('3100')"><div class="s-id">3100</div>ירושלים נבון</button>
        <button class="station-btn" onclick="trackByStation('3200')"><div class="s-id">3200</div>ירושלים ביג</button>
        <button class="station-btn" onclick="trackByStation('3700')"><div class="s-id">3700</div>בן גוריון</button>
        <button class="station-btn" onclick="trackByStation('4100')"><div class="s-id">4100</div>חיפה כרמל</button>
        <button class="station-btn" onclick="trackByStation('4600')"><div class="s-id">4600</div>נהריה</button>
        <button class="station-btn" onclick="trackByStation('5000')"><div class="s-id">5000</div>נתניה</button>
        <button class="station-btn" onclick="trackByStation('5200')"><div class="s-id">5200</div>פ"ת קריית אריה</button>
        <button class="station-btn" onclick="trackByStation('5410')"><div class="s-id">5410</div>כפר סבא נורדאו</button>
        <button class="station-btn" onclick="trackByStation('7000')"><div class="s-id">7000</div>הרצליה</button>
        <button class="station-btn" onclick="trackByStation('7300')"><div class="s-id">7300</div>באר שבע מרכז</button>
        <button class="station-btn" onclick="trackByStation('7500')"><div class="s-id">7500</div>אשדוד עד הלום</button>
        <button class="station-btn" onclick="trackByStation('7600')"><div class="s-id">7600</div>אשקלון</button>
        <button class="station-btn" onclick="trackByStation('2100')"><div class="s-id">2100</div>רחובות</button>
        <button class="station-btn" onclick="trackByStation('3500')"><div class="s-id">3500</div>לוד</button>
        <button class="station-btn" onclick="trackByStation('3600')"><div class="s-id">3600</div>רמלה</button>
        <button class="station-btn" onclick="trackByStation('8600')"><div class="s-id">8600</div>מודיעין נבון</button>
      </div>
    </div>

    <div id="results-train"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════
       Tab 5: Service alerts
  ══════════════════════════════════════════════════════ -->
  <div id="tab-alerts" class="tab-panel">
    <div class="search-row">
      <button class="btn" onclick="loadAlerts()">רענן התראות</button>
    </div>
    <div id="results-alerts"></div>
  </div>

</main>

<script>
// ── Constants ────────────────────────────────────────────
const OPEN_BUS_BASE = "https://open-bus-stride-api.hasadna.org.il";
const RAIL_BOARD    = "/proxy/rail";
const NOMINATIM     = "https://nominatim.openstreetmap.org/search";

const OPERATORS = {
  "3":"דן","5":"אגד","6":"אגד תעבורה","7":"קוופרטיב","10":"מטרופולין",
  "14":"קווים","15":"נתיב אקספרס","16":"ירושלים","18":"גולן",
  "20":"Kavim","25":"נצרת","42":"Extra",
};

const TRAIN_STATIONS = {
  "1500":"ת\"א סבידור מרכז","1600":"ת\"א השלום","1700":"ת\"א הרכבת",
  "2100":"רחובות","2200":"בני ברק","2300":"ת\"א מרכז",
  "2400":"ראשון לציון משה דיין","2500":"ראשון לציון הישן",
  "2600":"בת ים קוממיות","2820":"ת\"א השלום",
  "3100":"ירושלים נבון","3200":"ירושלים ביג","3300":"בית שמש",
  "3500":"לוד","3600":"רמלה","3700":"בן גוריון",
  "4100":"חיפה כרמל","4200":"חיפה בת גלים","4600":"נהריה",
  "4640":"עכו","4900":"חדרה מערב","5000":"נתניה",
  "5200":"פ\"ת קריית אריה","5300":"פ\"ת סגולה",
  "5410":"כפר סבא נורדאו","6700":"רעננה ב","7000":"הרצליה",
  "7100":"בני ברק","7200":"קריית גת","7300":"באר שבע מרכז",
  "7400":"דימונה","7500":"אשדוד עד הלום","7600":"אשקלון",
  "8600":"מודיעין נבון","9200":"כרמיאל","700":"חדרה מערב",
};

// ── Clock ────────────────────────────────────────────────
setInterval(() => {
  document.getElementById("live-time").textContent =
    new Date().toLocaleTimeString("he-IL");
}, 1000);

// ── Tab switching ────────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

// ── Utility helpers ──────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toR = d => d * Math.PI / 180;
  const dlat = toR(lat2-lat1), dlon = toR(lon2-lon1);
  const a = Math.sin(dlat/2)**2 + Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dlon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function ageStr(iso) {
  if (!iso) return "—";
  try {
    const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 0)  return "עכשיו";
    if (sec < 60) return `${sec}ש' לפני`;
    return `${Math.floor(sec/60)}דק' לפני`;
  } catch { return "—"; }
}

function bearingDir(b) {
  if (b == null) return "";
  const dirs = ["↑N","↗NE","→E","↘SE","↓S","↙SW","←W","↖NW"];
  return dirs[Math.round(((+b % 360) + 22.5) / 45) % 8];
}

function statusBadge(delaySec, cancelled) {
  if (cancelled)        return `<span class="badge-err">❌ בוטל</span>`;
  if (delaySec == null) return `<span class="badge-warn">❓ אין מידע</span>`;
  if (delaySec <= 60)   return `<span class="badge-ok">✅ בזמן</span>`;
  const m = Math.floor(delaySec/60);
  if (delaySec <= 300)  return `<span class="badge-warn">🟡 ${m} דק' איחור</span>`;
  if (delaySec <= 900)  return `<span class="badge-bad">🟠 ${m} דק' איחור</span>`;
  return `<span class="badge-err">🔴 ${m} דק' איחור</span>`;
}

function setLoading(el) {
  el.innerHTML = `<div class="loader"><div class="spinner"></div> טוען נתונים...</div>`;
}
function setMsg(el, text, type="") {
  el.innerHTML = `<div class="msg-box ${type}">${text}</div>`;
}

function fmtTime(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleTimeString("he-IL", { hour:"2-digit", minute:"2-digit" }); }
  catch { return iso.slice(11,16) || "—"; }
}

// Geocode via bot proxy (avoids CORS for Nominatim)
async function geocode(address) {
  const q = /ישר|israel/i.test(address) ? address : `${address}, Israel`;
  try {
    const r = await fetch(`/geocode?q=${encodeURIComponent(q)}`);
    if (r.ok) {
      const d = await r.json();
      if (d.lat) return { lat: d.lat, lon: d.lon, name: d.display_name || address };
    }
  } catch {}
  // fallback: direct Nominatim
  const r2 = await fetch(`${NOMINATIM}?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=he`);
  const data = await r2.json();
  if (!data.length) return null;
  return { lat: +data[0].lat, lon: +data[0].lon, name: data[0].display_name };
}

// ══════════════════════════════════════════════════════════
//  Tab 1 — Buses near address + future stops per bus
// ══════════════════════════════════════════════════════════
function quickAddr(a) { document.getElementById("addr-input").value = a; searchNearAddress(); }

async function searchNearAddress() {
  const addr   = document.getElementById("addr-input").value.trim();
  const radius = parseInt(document.getElementById("addr-radius").value) || 500;
  const out    = document.getElementById("results-bus");
  if (!addr) { setMsg(out, "הכנס כתובת לחיפוש", "warn"); return; }

  setLoading(out);

  let geo;
  try { geo = await geocode(addr); }
  catch(e) { setMsg(out, `❌ שגיאת Nominatim: ${e.message}`, "err"); return; }
  if (!geo) { setMsg(out, "❌ הכתובת לא נמצאה. נסה ניסוח אחר.", "err"); return; }

  // Bounding box query
  const deg_m = 0.00001;
  const lat_d = (radius * deg_m) * 1.2;
  const lon_d = (radius * deg_m) * 1.5;
  let vehicles = [];
  try {
    const url = `${OPEN_BUS_BASE}/siri_vehicle_locations/list?` +
      `lon__greater_or_equal=${(geo.lon - lon_d).toFixed(5)}&lon__lower_or_equal=${(geo.lon + lon_d).toFixed(5)}` +
      `&lat__greater_or_equal=${(geo.lat - lat_d).toFixed(5)}&lat__lower_or_equal=${(geo.lat + lat_d).toFixed(5)}` +
      `&limit=100&order_by=id desc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    vehicles = await r.json();
  } catch(e) {
    setMsg(out, `❌ שגיאת Open Bus Stride: ${e.message}`, "err"); return;
  }

  // Exact haversine filter
  vehicles = vehicles
    .map(v => ({ ...v, _dist: haversine(geo.lat, geo.lon, +v.lat, +v.lon) }))
    .filter(v => v._dist <= radius)
    .sort((a, b) => a._dist - b._dist);

  if (!vehicles.length) {
    setMsg(out, `⚠️ לא נמצאו אוטובוסים בטווח ${radius}מ' מ: ${geo.name.slice(0,60)}`, "warn");
    return;
  }

  let html = `<div class="summary">📍 ${geo.name.slice(0,80)} &nbsp;|&nbsp; נמצאו ${vehicles.length} רכבים בטווח ${radius}מ'</div>`;
  for (let i = 0; i < vehicles.length; i++) {
    const v      = vehicles[i];
    const line   = v.siri_route__line_ref || v.line_ref || "—";
    const opId   = String(v.siri_route__operator_ref || v.operator_ref || "");
    const opName = OPERATORS[opId] || `מפעיל ${opId}`;
    const bearing = bearingDir(v.bearing);
    const spd    = v.velocity != null ? `💨 ${(+v.velocity).toFixed(0)} קמ"ש &nbsp;` : "";
    const vid    = v.siri_ride__vehicle_ref ? `🚌 רכב ${v.siri_ride__vehicle_ref} &nbsp;` : "";
    const sched  = v.siri_ride__scheduled_start_time
      ? `🕐 ${v.siri_ride__scheduled_start_time.slice(11,16)} &nbsp;` : "";
    const rideId = v.siri_ride__id || v.siri_ride_id || "";
    const cardId = `bus-card-${i}`;
    const panelId = `stops-panel-${i}`;

    html += `
    <div class="v-card" id="${cardId}">
      <div class="v-header">
        <span class="line-badge">קו ${line}</span>
        <span class="op-name">${opName}</span>
        <span class="age">${Math.round(v._dist)}מ' ממך &nbsp; ${bearing} &nbsp; עדכון: ${ageStr(v.recorded_at_time)}</span>
      </div>
      <div class="v-row">${vid}${spd}${sched}</div>
      ${rideId
        ? `<button class="stops-toggle" onclick="toggleStops('${panelId}','${rideId}',this)">▶ הצג תחנות עתידיות</button>
           <div class="stops-panel" id="${panelId}"></div>`
        : `<div style="font-size:.75rem;color:var(--muted)">מזהה נסיעה חסר — לא ניתן לטעון תחנות</div>`
      }
    </div>`;
  }
  out.innerHTML = html;
}

async function toggleStops(panelId, rideId, btn) {
  const panel = document.getElementById(panelId);
  if (panel.classList.contains("open")) {
    panel.classList.remove("open");
    btn.textContent = "▶ הצג תחנות עתידיות";
    return;
  }
  btn.textContent = "⏳ טוען תחנות...";
  btn.disabled = true;
  panel.classList.add("open");

  try {
    const url = `${OPEN_BUS_BASE}/siri_ride_stops/list?siri_ride_id=${rideId}&limit=100&order_by=order asc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const stops = await r.json();

    if (!stops.length) {
      panel.innerHTML = `<div style="font-size:.82rem;color:var(--muted);padding:6px 0">לא נמצאו תחנות לנסיעה זו</div>`;
      btn.textContent = "▼ תחנות עתידיות";
      btn.disabled = false;
      return;
    }

    const now = new Date();
    // Separate future (not yet arrived) from past stops
    const future = [];
    const past   = [];
    for (const s of stops) {
      const t = s.planned_arrival_time || s.actual_arrival_time || s.expected_arrival_time;
      const isPast = t ? new Date(t) < now : false;
      (isPast ? past : future).push({ ...s, _time: t });
    }

    let html = `<div style="font-size:.78rem;color:var(--muted);margin-bottom:6px">
      ${future.length} תחנות עתידיות · ${past.length} תחנות שחלפו</div>`;

    if (!future.length) {
      html += `<div style="font-size:.82rem;color:var(--muted)">הרכבת עברה את כל התחנות ברשימה</div>`;
    } else {
      for (const s of future) {
        const name    = s.gtfs_stop__stop_name || s.stop_name || `תחנה ${s.gtfs_stop_id || s.stop_id || "?"}`;
        const stopId  = s.gtfs_stop__stop_code || s.gtfs_stop_id || s.stop_id || "";
        const timeStr = s._time ? fmtTime(s._time) : "—";
        const seq     = s.order != null ? s.order : "";
        html += `
        <div class="stop-row">
          <span class="stop-seq">${seq}</span>
          <span class="stop-name">🚏 ${name}${stopId ? ` <span style="color:var(--muted);font-size:.72rem">(${stopId})</span>` : ""}</span>
          <span class="stop-time">⏰ ${timeStr}</span>
        </div>`;
      }
    }

    panel.innerHTML = html;
    btn.textContent = "▼ הסתר תחנות";
  } catch(e) {
    panel.innerHTML = `<div style="font-size:.82rem;color:var(--red)">❌ שגיאה בטעינת תחנות: ${e.message}</div>`;
    btn.textContent = "▼ שגיאה";
  }
  btn.disabled = false;
}

// ══════════════════════════════════════════════════════════
//  Tab 2 — Track bus line + operator → line picker
// ══════════════════════════════════════════════════════════
function quickLine(n) { document.getElementById("line-input").value = n; searchLine(); }

async function loadLinesForOperator() {
  const opId  = document.getElementById("line-operator").value;
  const wrap  = document.getElementById("lines-picker-wrap");
  const picker = document.getElementById("lines-picker");
  const label  = document.getElementById("lines-picker-label");

  if (!opId) { wrap.style.display = "none"; return; }

  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.gap = "8px";
  label.textContent = "טוען קווים...";
  picker.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

  const opName = OPERATORS[opId] || opId;

  try {
    const url = `${OPEN_BUS_BASE}/gtfs_routes/list?operator_refs=${opId}&limit=500&order_by=line_ref asc`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const routes = await r.json();

    if (!routes.length) {
      label.textContent = `לא נמצאו קווים עבור ${opName}`;
      picker.innerHTML = "";
      return;
    }

    // Deduplicate by line_ref
    const seen = new Set();
    const unique = routes.filter(rt => {
      const key = String(rt.line_ref || rt.route_short_name || rt.route_id || "");
      if (!key || seen.has(key)) return false;
      seen.add(key); return true;
    });

    label.textContent = `${unique.length} קווים עבור ${opName} — לחץ לבחירה:`;
    picker.innerHTML = unique.map(rt => {
      const lineRef = String(rt.line_ref || rt.route_short_name || rt.route_id || "?");
      const desc    = rt.route_long_name || rt.route_desc || "";
      return `<span class="line-chip" title="${desc}" onclick="pickLine('${lineRef}')">קו ${lineRef}</span>`;
    }).join("");
  } catch(e) {
    label.textContent = `❌ שגיאה בטעינת קווים: ${e.message}`;
    picker.innerHTML = "";
  }
}

function pickLine(lineRef) {
  document.getElementById("line-input").value = lineRef;
  searchLine();
}

async function searchLine() {
  const line = document.getElementById("line-input").value.trim();
  const opId = document.getElementById("line-operator").value;
  const out  = document.getElementById("results-line");
  if (!line) { setMsg(out, "הכנס מספר קו", "warn"); return; }

  setLoading(out);

  let url = `${OPEN_BUS_BASE}/siri_vehicle_locations/list?line_ref=${encodeURIComponent(line)}&limit=100&order_by=id desc`;
  if (opId) url += `&operator_ref=${opId}`;

  let vehicles = [];
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    vehicles = await r.json();
  } catch(e) {
    setMsg(out, `❌ שגיאת Open Bus Stride: ${e.message}`, "err"); return;
  }

  if (!vehicles.length) {
    setMsg(out, `⚠️ לא נמצאו רכבים פעילים בקו ${line}. ייתכן שהקו אינו פעיל כרגע.`, "warn");
    return;
  }

  const byDir = {};
  for (const v of vehicles) {
    const d = String(v.direction_ref ?? v.direction_id ?? "0");
    (byDir[d] = byDir[d] || []).push(v);
  }

  let html = `<div class="summary">🚌 קו ${line} — ${vehicles.length} רכבים פעילים</div>`;
  for (const [dir, vlist] of Object.entries(byDir)) {
    const label = dir === "0" ? "כיוון א׳" : dir === "1" ? "כיוון ב׳" : `כיוון ${dir}`;
    html += `<div style="font-size:.85rem;font-weight:600;color:var(--cyan);margin:8px 0 4px">${label} (${vlist.length} רכבים)</div>`;
    for (const v of vlist) {
      const opName = OPERATORS[String(v.siri_route__operator_ref||v.operator_ref||"")] || `מפעיל ${v.siri_route__operator_ref||v.operator_ref||"?"}`;
      const dir2   = bearingDir(v.bearing);
      const spd    = v.velocity != null ? `💨 ${(+v.velocity).toFixed(0)} קמ"ש &nbsp;` : "";
      const vid    = v.siri_ride__vehicle_ref ? `🚌 רכב ${v.siri_ride__vehicle_ref} &nbsp;` : "";
      const coord  = v.lat ? `📍 ${(+v.lat).toFixed(5)}, ${(+v.lon).toFixed(5)}` : "";
      html += `
      <div class="v-card">
        <div class="v-header">
          <span class="line-badge">קו ${v.siri_route__line_ref || v.line_ref || line}</span>
          <span class="op-name">${opName}</span>
          <span class="age">${dir2} &nbsp; עדכון: ${ageStr(v.recorded_at_time)}</span>
        </div>
        <div class="v-row">${coord} &nbsp; ${vid}${spd}</div>
      </div>`;
    }
  }
  out.innerHTML = html;
}

//  Tab 3 — Train station board
// ══════════════════════════════════════════════════════════
function quickStation(sid) { document.getElementById("station-input").value = sid; searchStation(); }

async function searchStation() {
  const sid  = document.getElementById("station-input").value.trim();
  const out  = document.getElementById("results-station");
  if (!sid) { setMsg(out, "הכנס מספר תחנה", "warn"); return; }

  const sName = TRAIN_STATIONS[sid] || `תחנה ${sid}`;
  setLoading(out);

  const today = new Date().toISOString().slice(0,10);
  const hour  = new Date().getHours();

  let data;
  try {
    const r = await fetch(`${RAIL_BOARD}?stationId=${sid}&date=${today}&hour=${hour}`,
      { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
  } catch(e) {
    setMsg(out, `❌ שגיאת Railways API: ${e.message}<br>
      <small style="color:var(--muted)">הרץ בטרמינל: <code style="color:var(--cyan)">python3 transit_query.py --train-station ${sid}</code></small>`, "err");
    return;
  }

  const trains = data?.result?.trains || data?.Data || data?.trains || [];
  if (!trains.length) {
    setMsg(out, `⚠️ אין נסיעות בתחנת ${sName} בשעה הנוכחית.`, "warn");
    return;
  }

  let html = `<div class="summary">🚆 ${sName} — ${trains.length} נסיעות קרובות</div>`;
  for (const t of trains.slice(0, 15)) html += renderTrain(t);
  out.innerHTML = html;
}

function renderTrain(t) {
  const trainNum  = t.trainno  || t.TrainNumber  || "—";
  const schedDep  = t.departureTime       || t.DepartureTime       || "—";
  const actualDep = t.actualDepartureTime || t.ActualDepartureTime || "";
  const schedArr  = t.arrivalTime         || t.ArrivalTime         || "";
  const actualArr = t.actualArrivalTime   || t.ActualArrivalTime   || "";
  const platform  = t.platform  || t.Platform  || "?";
  const destId    = String(t.destStation    || t.DestinationStation || "");
  const origId    = String(t.orignStation   || t.OriginStation      || "");
  const cancelled = !!(t.isCancelled || t.IsCancelled);

  const destName  = TRAIN_STATIONS[destId]  || `תחנה ${destId}`;
  const origName  = TRAIN_STATIONS[origId]  || `תחנה ${origId}`;

  let delaySec = null;
  if (schedDep && schedDep !== "—" && actualDep && actualDep !== schedDep) {
    try {
      const toMin = s => { const c = String(s).replace(":",""); return +c.slice(0,2)*60 + +c.slice(2,4); };
      delaySec = (toMin(actualDep) - toMin(schedDep)) * 60;
    } catch {}
  }

  const delayed  = actualDep && actualDep !== schedDep;
  const delayedA = actualArr && actualArr !== schedArr;

  return `
  <div class="train-row">
    <div class="tn">🚆 ${trainNum}</div>
    <div class="route">${origName} → ${destName}</div>
    <div class="platform">רציף ${platform}</div>
    <div class="times">
      יציאה: <span ${delayed?'style="text-decoration:line-through;color:var(--muted)"':''}>${schedDep}</span>
      ${delayed ? `<span style="color:var(--orange)"> → ${actualDep}</span>` : ""}
      &nbsp;|&nbsp; ${statusBadge(delaySec, cancelled)}
      ${schedArr ? `&nbsp;|&nbsp; הגעה: <span>${schedArr}</span>${delayedA?`<span style="color:var(--orange)"> → ${actualArr}</span>`:""}` : ""}
    </div>
  </div>`;
}

let _selectedTrainStation = null;

async function trackByStation(sid) {
  // Highlight selected station button
  document.querySelectorAll("#train-station-grid .station-btn").forEach(b => b.classList.remove("active"));
  event.currentTarget.classList.add("active");
  _selectedTrainStation = sid;

  const trainNum = document.getElementById("train-input").value.trim();
  const out      = document.getElementById("results-train");
  const sName    = TRAIN_STATIONS[sid] || `תחנה ${sid}`;
  setLoading(out);

  const today = new Date().toISOString().slice(0,10);
  const hour  = new Date().getHours();

  let data;
  try {
    const r = await fetch(`${RAIL_BOARD}?stationId=${sid}&date=${today}&hour=${hour}`,
      { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
  } catch(e) {
    setMsg(out, `❌ שגיאת Railways API: ${e.message}`, "err"); return;
  }

  let trains = data?.result?.trains || data?.Data || data?.trains || [];

  if (!trains.length) {
    setMsg(out, `⚠️ אין נסיעות בתחנת ${sName} בשעה הנוכחית.`, "warn");
    return;
  }

  // Filter by train number if provided
  if (trainNum) {
    trains = trains.filter(t => String(t.trainno || t.TrainNumber || "") === trainNum);
    if (!trains.length) {
      setMsg(out, `⚠️ רכבת ${trainNum} לא נמצאה בתחנת ${sName}. נסה תחנה אחרת.`, "warn");
      return;
    }
  }

  const filterNote = trainNum ? ` · מסונן לרכבת ${trainNum}` : "";
  let html = `<div class="summary">🚆 ${sName} — ${trains.length} נסיעות${filterNote}</div>`;
  for (const t of trains.slice(0, 20)) html += renderTrain(t);
  out.innerHTML = html;
}

async function trackTrain() {
  // Search by train number across all key stations
  const trainNum = document.getElementById("train-input").value.trim();
  const out      = document.getElementById("results-train");
  if (!trainNum) { setMsg(out, "הכנס מספר רכבת או לחץ על תחנה", "warn"); return; }

  setLoading(out);

  const today = new Date().toISOString().slice(0,10);
  const hour  = new Date().getHours();
  const checkStations = ["1500","1600","2300","3100","3700","4100","5000","7000","7300","7500","7600","3500","3600","8600"];

  let found = [], foundStations = [];
  for (const sid of checkStations) {
    try {
      const r = await fetch(`${RAIL_BOARD}?stationId=${sid}&date=${today}&hour=${hour}`,
        { headers: { Accept: "application/json" } });
      if (!r.ok) continue;
      const data = await r.json();
      const trains = data?.result?.trains || data?.Data || data?.trains || [];
      for (const t of trains) {
        if (String(t.trainno || t.TrainNumber || "") === trainNum) {
          found.push(t);
          foundStations.push(TRAIN_STATIONS[sid] || `תחנה ${sid}`);
        }
      }
    } catch {}
  }

  if (!found.length) {
    setMsg(out, `⚠️ רכבת ${trainNum} לא נמצאה. ייתכן שטרם יצאה, הגיעה ליעד, או שמספרה שגוי.<br>
      <small style="color:var(--muted)">נסה לבחור תחנה ספציפית מהרשימה למעלה</small>`, "warn");
    return;
  }

  let html = `<div class="summary">✅ רכבת ${trainNum} נמצאה ב-${found.length} תחנות: ${foundStations.join(", ")}</div>`;
  for (const t of found) html += renderTrain(t);
  out.innerHTML = html;
}

  const out = document.getElementById("results-alerts");
  setLoading(out);

  let apiStatus = "";
  try {
    const r = await fetch(`${OPEN_BUS_BASE}/siri_vehicle_locations/list?limit=1&order_by=id desc`);

      const data = await r.json();

        const age = Math.round((Date.now() - new Date(data[0].recorded_at_time).getTime()) / 60000);
        apiStatus = `<div class="msg-box ok">✅ Open Bus Stride API פעיל — נתון אחרון מלפני ${age} דקות</div>`;
      }
    }
  } catch {}

  out.innerHTML = `
    ${apiStatus}
    <div class="alert-card">
      <div class="a-title">🔔 התראות שירות — GTFS-RT ServiceAlerts</div>
      <div class="a-effect">GTFS-RT הוא פורמט בינארי (protobuf) שאינו ניתן לפענוח ישירות בדפדפן.</div>
      <div style="font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.8">
        להצגת התראות פעילות הרץ בטרמינל:<br>
        <code style="color:var(--cyan)">python3 transit_query.py --alerts</code>
      </div>
    </div>
