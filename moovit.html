<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NAYA Transit — תחבורה ציבורית ישראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #00B1D2;
    --primary-dark: #0090B0;
    --primary-light: #E0F7FC;
    --text: #1A1A2E;
    --text-muted: #6B7280;
    --bg: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E5E7EB;
    --shadow: 0 2px 16px rgba(0,0,0,0.12);
    --radius: 16px;
    --op-dan: #FF6B00;
    --op-egged: #003087;
    --op-nta: #E3000F;
    --op-rail: #6B21A8;
    --op-kavim: #16A34A;
    --op-natib: #0284C7;
    --op-metro: #0891B2;
    --op-superbus: #DC2626;
  }
  body {
    font-family: 'Heebo', sans-serif;
    background: #E8EDF2;
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    direction: rtl;
  }

  /* ── Map ─────────────────────────────────────────────────────── */
  #map {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── Top bar ─────────────────────────────────────────────────── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,177,210,0.3);
    height: 56px;
  }
  #topbar .logo {
    width: 32px; height: 32px;
    background: white;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #topbar .logo svg { width: 20px; height: 20px; }
  #topbar .title {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.3px;
    flex: 1;
  }
  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4ADE80;
    box-shadow: 0 0 6px #4ADE80;
    flex-shrink: 0;
  }
  #status-dot.offline { background: #F87171; box-shadow: 0 0 6px #F87171; }
  #status-label {
    font-size: 0.75rem;
    opacity: 0.9;
    font-weight: 500;
  }

  /* ── Search box ──────────────────────────────────────────────── */
  #search-box {
    position: fixed;
    top: 64px; left: 12px; right: 12px;
    z-index: 99;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .search-dot.from { background: var(--primary); }
  .search-dot.to   { background: #6B21A8; }
  .search-line {
    width: 2px; height: 12px;
    background: var(--border);
    margin: 0 4px 0 4px;
    align-self: center;
    flex-shrink: 0;
  }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    font-family: 'Heebo', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    background: transparent;
    padding: 4px 0;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-divider {
    height: 1px;
    background: var(--border);
    margin: 2px 18px;
  }
  .search-actions {
    display: flex;
    gap: 8px;
    padding-top: 4px;
  }
  #btn-plan {
    flex: 1;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-family: 'Heebo', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #btn-plan:hover { background: var(--primary-dark); }
  #btn-location {
    width: 40px; height: 40px;
    background: var(--primary-light);
    color: var(--primary);
    border: none;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  #btn-location:hover { background: #B2EBF2; }

  /* ── Bottom panel ────────────────────────────────────────────── */
  #bottom-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: white;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
    transform: translateY(calc(100% - 64px));
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    max-height: 75dvh;
    display: flex;
    flex-direction: column;
  }
  #bottom-panel.open {
    transform: translateY(0);
  }
  #panel-handle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .handle-bar {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto;
  }
  #panel-title {
    font-weight: 700;
    font-size: 1rem;
    color: var(--text);
    flex: 1;
    text-align: center;
  }
  #panel-close {
    width: 28px; height: 28px;
    background: var(--surface);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  #panel-content {
    overflow-y: auto;
    padding: 0 12px 20px;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }
  #panel-content::-webkit-scrollbar { width: 4px; }
  #panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Route result cards ──────────────────────────────────────── */
  .route-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--surface);
    margin-bottom: 8px;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    border-right: 4px solid var(--card-color, var(--primary));
  }
  .route-card:hover, .route-card.active {
    border-color: var(--card-color, var(--primary));
    background: white;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .line-badge {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--card-color, var(--primary));
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    font-weight: 800;
    flex-shrink: 0;
    letter-spacing: -0.5px;
  }
  .route-info { flex: 1; min-width: 0; }
  .route-name {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .route-sub {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .route-vehicles {
    background: #F0FFF4;
    color: #16A34A;
    border-radius: 8px;
    padding: 3px 8px;
    font-size: 0.75rem;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* ── Stop list ───────────────────────────────────────────────── */
  .stop-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .stop-item:last-child { border-bottom: none; }
  .stop-num {
    width: 24px; height: 24px;
    background: var(--primary);
    color: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .stop-name {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    line-height: 1.4;
  }
  .stop-city {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ── Nearby stop cards ───────────────────────────────────────── */
  .nearby-card {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--surface);
    margin-bottom: 8px;
    border-right: 3px solid var(--primary);
  }
  .nearby-name { font-weight: 600; font-size: 0.9rem; }
  .nearby-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 3px; }
  .nearby-routes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .route-pill {
    background: var(--primary-light);
    color: var(--primary-dark);
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* ── Direction tabs ──────────────────────────────────────────── */
  .dir-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .dir-tab {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    font-family: 'Heebo', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .dir-tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* ── Loading / empty states ──────────────────────────────────── */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state {
    text-align: center;
    padding: 28px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }

  /* ── Map FAB (floating action button) ───────────────────────── */
  #fab-nearby {
    position: fixed;
    bottom: 80px; left: 16px;
    z-index: 101;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: white;
    border: none;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  #fab-nearby:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  }

  /* ── Back button inside panel ────────────────────────────────── */
  #btn-back {
    display: none;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--primary);
    font-family: 'Heebo', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 0 8px;
  }
  #btn-back.visible { display: flex; }

  /* ── Vehicles header ─────────────────────────────────────────── */
  .veh-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #F0FFF4;
    border-radius: 8px;
    margin-bottom: 10px;
    font-size: 0.82rem;
    color: #16A34A;
    font-weight: 600;
  }

  /* ── Responsiveness ──────────────────────────────────────────── */
  @media (min-width: 640px) {
    #search-box {
      max-width: 480px;
      left: 50%; right: auto;
      transform: translateX(-50%);
    }
    #bottom-panel {
      max-width: 480px;
      left: 50%; right: auto;
      transform: translateX(-50%) translateY(calc(100% - 64px));
      border-radius: 20px;
      bottom: 24px;
    }
    #bottom-panel.open {
      transform: translateX(-50%) translateY(0);
    }
    #fab-nearby { left: calc(50% - 240px + 16px); }
  }
</style>
</head>
<body>

<!-- Map -->
<div id="map"></div>

<!-- Top bar -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C7.03 2 3 6.03 3 11C3 17.25 12 22 12 22C12 22 21 17.25 21 11C21 6.03 16.97 2 12 2ZM12 13.5C10.62 13.5 9.5 12.38 9.5 11C9.5 9.62 10.62 8.5 12 8.5C13.38 8.5 14.5 9.62 14.5 11C14.5 12.38 13.38 13.5 12 13.5Z" fill="#00B1D2"/>
    </svg>
  </div>
  <span class="title">NAYA Transit</span>
  <span id="status-label">מתחבר...</span>
  <div id="status-dot" class="offline"></div>
</div>

<!-- Search box -->
<div id="search-box">
  <div class="search-row">
    <div class="search-dot from"></div>
    <input id="input-from" class="search-input" placeholder="מאיפה? (כתובת, עיר...)" type="text" autocomplete="off">
  </div>
  <div class="search-divider"></div>
  <div class="search-row">
    <div class="search-dot to"></div>
    <input id="input-to" class="search-input" placeholder="לאן? (כתובת, עיר...)" type="text" autocomplete="off">
  </div>
  <div class="search-actions">
    <button id="btn-location" onclick="useMyLocation()" title="מיקום נוכחי">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
      </svg>
    </button>
    <button id="btn-plan" onclick="planTrip()">תכנן מסלול</button>
  </div>
</div>

<!-- FAB -->
<button id="fab-nearby" onclick="showNearby()" title="תחנות קרובות">
  <span>&#x1F687;</span>
</button>

<!-- Bottom panel -->
<div id="bottom-panel">
  <div id="panel-handle" onclick="togglePanel()">
    <div style="width:28px"></div>
    <span id="panel-title">תחבורה ציבורית — גוש דן</span>
    <button id="panel-close" onclick="event.stopPropagation(); closePanel()">&#x2715;</button>
  </div>
  <div id="panel-content">
    <div id="panel-inner">
      <div class="empty-state">
        <div class="icon">&#x1F68C;</div>
        <div>הזן כתובות לתכנון מסלול<br>או לחץ על <strong>&#x1F687;</strong> לתחנות קרובות</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────
const API = '';  // same-origin
const OP_COLORS = {
  "3":  "#FF6B00",
  "5":  "#003087",
  "6":  "#E3000F",
  "2":  "#6B21A8",
  "21": "#16A34A",
  "25": "#0284C7",
  "14": "#0891B2",
  "18": "#DC2626",
  "15": "#7C3AED",
  "16": "#D97706",
  "32": "#374151",
  "42": "#059669",
};
const OP_NAMES = {
  "2":"רכבת ישראל","3":"דן","5":"אגד","6":"NTA מטרופולין",
  "14":"מטרופולין","15":"אגד תעבורה","16":"תנופה",
  "18":"סופרבוס","21":"קווים","25":"נתיב אקספרס",
  "32":"V-Line","42":"אפיקים"
};

// ── Map init ─────────────────────────────────────────────────────
const map = L.map('map', {
  center: [32.08, 34.79],
  zoom: 13,
  zoomControl: false,
  attributionControl: false,
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; CartoDB',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomleft' }).addTo(map);

// ── State ────────────────────────────────────────────────────────
let vehicleMarkers = [];
let stopMarkers    = [];
let userMarker     = null;
let panelOpen      = false;
let currentView    = 'home';   // 'home' | 'results' | 'stops'
let lastRoutes     = [];

// ── Panel helpers ────────────────────────────────────────────────
function openPanel(title, html) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-inner').innerHTML = html;
  const p = document.getElementById('bottom-panel');
  p.classList.add('open');
  panelOpen = true;
}
function closePanel() {
  document.getElementById('bottom-panel').classList.remove('open');
  panelOpen = false;
}
function togglePanel() {
  panelOpen ? closePanel() : document.getElementById('bottom-panel').classList.add('open');
  panelOpen = !panelOpen;
}

// ── Status indicator ─────────────────────────────────────────────
function setStatus(ok, text) {
  const dot = document.getElementById('status-dot');
  const lbl = document.getElementById('status-label');
  dot.className = ok ? '' : 'offline';
  lbl.textContent = text;
}

// ── Load live vehicles ────────────────────────────────────────────
function renderVehicles(data) {
  vehicleMarkers.forEach(m => map.removeLayer(m));
  vehicleMarkers = [];
  data.forEach(b => {
    const lat = parseFloat(b.lat || b.calculated_lat || b.latitude || 0);
    const lon = parseFloat(b.lon || b.calculated_lon || b.longitude || 0);
    if (!lat || !lon) return;
    const op   = String(b.operator_ref || b.siri_route__operator_ref || '3');
    const col  = OP_COLORS[op] || '#00B1D2';
    const lname = b.line_name || b.route_short_name
                  || b.siri_route__gtfs_route__route_short_name
                  || b.line_ref || b.siri_route__line_ref || '';
    const mk = L.circleMarker([lat, lon], {
      radius: 5, fillColor: col, color: 'white',
      weight: 1.5, fillOpacity: 0.9, opacity: 1,
    });
    mk.bindTooltip(`קו ${lname} — ${OP_NAMES[op] || ''}`, {direction:'top'});
    mk.addTo(map);
    vehicleMarkers.push(mk);
  });
  setStatus(true, `${vehicleMarkers.length} כלי רכב פעילים`);
}

function loadVehicles() {
  // קודם נסה /buses (cache מקומי)
  fetch(`${API}/buses`)
    .then(r => r.json())
    .then(data => {
      const buses = Array.isArray(data) ? data : (data.buses || []);
      if (buses.length > 0) {
        renderVehicles(buses);
      } else {
        // fallback: Stride ישיר עם bbox של גוש דן
        const p = new URLSearchParams({
          lat__greater_or_equal: 31.97, lat__lower_or_equal: 32.19,
          lon__greater_or_equal: 34.73, lon__lower_or_equal: 34.93,
          limit: 200, order_by: 'id desc'
        });
        fetch(`${API}/proxy/stride/siri_vehicle_locations/list?${p}`)
          .then(r => r.json())
          .then(sv => renderVehicles(Array.isArray(sv) ? sv : []))
          .catch(() => setStatus(false, 'שגיאה בטעינת כלי רכב'));
      }
    })
    .catch(() => setStatus(false, 'שגיאת חיבור'));
}

// Auto-refresh every 30s
loadVehicles();
setInterval(loadVehicles, 30000);

// פתח פאנל תחתון בטעינה כדי שיהיה גלוי
document.getElementById('bottom-panel').classList.add('open');
panelOpen = true;

// ── Use my location ───────────────────────────────────────────────
function useMyLocation() {
  if (!navigator.geolocation) {
    alert('הדפדפן שלך אינו תומך ב-GPS');
    return;
  }
  setStatus(null, 'מאתר מיקום...');
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    map.setView([lat, lon], 15);

    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([lat, lon], {
      radius: 8, fillColor: '#00B1D2', color: 'white',
      weight: 2, fillOpacity: 1,
    }).addTo(map);

    fetch(`${API}/reverse_geocode?lat=${lat}&lon=${lon}`)
      .then(r => r.json())
      .then(d => {
        document.getElementById('input-from').value = d.address || '';
        setStatus(true, 'מיקום נוכחי');
        showNearbyAt(lat, lon, d.address || `${lat.toFixed(4)},${lon.toFixed(4)}`);
      })
      .catch(() => setStatus(false, 'שגיאה'));
  }, () => {
    setStatus(false, 'לא ניתן לגשת ל-GPS');
  });
}

// ── Nearby stops ──────────────────────────────────────────────────
function showNearby() {
  const fromVal = document.getElementById('input-from').value.trim();
  if (fromVal) {
    geocodeAddr(fromVal, (lat, lon, label) => showNearbyAt(lat, lon, label));
    return;
  }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      showNearbyAt(pos.coords.latitude, pos.coords.longitude, 'מיקום נוכחי');
    }, () => openPanel('תחנות קרובות', '<div class="empty-state"><div class="icon">&#x1F4CD;</div><div>לא ניתן לאתר מיקום. הזן כתובת בשדה "מאיפה"</div></div>'));
  }
}

function showNearbyAt(lat, lon, label) {
  openPanel(`תחנות ליד ${label}`, '<div class="loader"><div class="spinner"></div>מחפש תחנות קרובות...</div>');
  currentView = 'nearby';

  fetch(`${API}/gtfs/nearby?lat=${lat}&lon=${lon}&radius=600`)
    .then(r => r.json())
    .then(data => {
      const stops = data.stops || [];
      if (!stops.length) {
        openPanel(`תחנות ליד ${label}`, '<div class="empty-state"><div class="icon">&#x1F645;</div><div>לא נמצאו תחנות ב-600 מטר</div></div>');
        return;
      }
      clearStopMarkers();
      let html = `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:10px">${stops.length} תחנות ב-600 מטר</div>`;
      stops.forEach(s => {
        const routes = (s.routes || []).slice(0, 5);
        const pills  = routes.map(r => `<span class="route-pill">${r.route_short_name}</span>`).join('');
        html += `<div class="nearby-card">
          <div class="nearby-name">${s.stop_name || 'תחנה'}</div>
          <div class="nearby-meta">${s.distance_m ? Math.round(s.distance_m) + ' מ\'' : ''} ${s.city || ''}</div>
          ${pills ? `<div class="nearby-routes">${pills}</div>` : ''}
        </div>`;

        if (s.stop_lat && s.stop_lon) {
          const mk = L.marker([s.stop_lat, s.stop_lon], {
            icon: L.divIcon({
              className: '',
              html: `<div style="width:10px;height:10px;background:#00B1D2;border:2px solid white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
              iconAnchor: [5,5],
            })
          }).addTo(map);
          mk.bindTooltip(s.stop_name || 'תחנה', { direction: 'top' });
          stopMarkers.push(mk);
        }
      });
      openPanel(`תחנות ליד ${label}`, html);
    })
    .catch(() => openPanel('שגיאה', '<div class="empty-state"><div class="icon">&#x26A0;</div><div>לא ניתן לטעון תחנות כרגע</div></div>'));
}

function clearStopMarkers() {
  stopMarkers.forEach(m => map.removeLayer(m));
  stopMarkers = [];
}

// ── Geocode helper ────────────────────────────────────────────────
function geocodeAddr(addr, cb) {
  fetch(`${API}/geocode?q=${encodeURIComponent(addr)}`)
    .then(r => r.json())
    .then(d => {
      if (d.lat) cb(d.lat, d.lon, d.display_name || addr);
      else cb(null, null, addr);
    })
    .catch(() => cb(null, null, addr));
}

// ── Plan trip ─────────────────────────────────────────────────────
function planTrip() {
  const from = document.getElementById('input-from').value.trim();
  const to   = document.getElementById('input-to').value.trim();
  if (!from || !to) {
    openPanel('תכנון מסלול', '<div class="empty-state"><div class="icon">&#x1F4CD;</div><div>הזן כתובת מוצא וכתובת יעד</div></div>');
    return;
  }
  openPanel(`${from} ← ${to}`, '<div class="loader"><div class="spinner"></div>מחפש קווים פעילים... (עד 15 שניות)</div>');
  currentView = 'results';

  const ctrl = new AbortController();
  const tid   = setTimeout(() => ctrl.abort(), 20000);  // 20s timeout

  fetch(`${API}/route_plan?origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}`,
        { signal: ctrl.signal })
    .then(r => r.json())
    .then(data => {
      clearTimeout(tid);
      const routes = data.routes || [];
      if (data.error && !routes.length) {
        openPanel('שגיאה', `<div class="empty-state"><div class="icon">⚠️</div><div>${data.error}</div></div>`);
        return;
      }
      if (!routes.length) {
        openPanel('לא נמצאו קווים', '<div class="empty-state"><div class="icon">🤷</div><div>לא נמצאו קווים פעילים כרגע.<br>נסה כתובות ספציפיות יותר, למשל: "דיזנגוף 50 תל אביב"</div></div>');
        return;
      }
      lastRoutes = routes;
      renderRouteResults(routes, data.origin, data.destination);
    })
    .catch(e => {
      clearTimeout(tid);
      const msg = e.name === 'AbortError' ? 'הבקשה לקחה יותר מדי זמן — נסי שוב' : e.message;
      openPanel('שגיאה', `<div class="empty-state"><div class="icon">⚠️</div><div>${msg}</div></div>`);
    });
}

function renderRouteResults(routes, origin, destination) {
  const olabel = origin ? origin.label : '';
  const dlabel = destination ? destination.label : '';
  let html = `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:12px">
    ${routes.length} קווים פעילים בין ${olabel} ל-${dlabel}
  </div>`;

  routes.forEach((r, idx) => {
    const lr   = r.line_ref || '';
    const ln   = r.line_name || lr;
    const op   = r.operator || '';
    const opId = getOpId(op);
    const col  = OP_COLORS[opId] || '#00B1D2';
    const cnt  = (r.vehicles || []).length;
    const os   = r.origin_stop || '';
    const fs   = r.final_stop  || '';
    const sub  = op + (cnt ? ` · ${cnt} כלי רכב` : '') + (os && fs ? ` · מ-${os} ל-${fs}` : os ? ` · מ-${os}` : '');

    html += `<div class="route-card" style="--card-color:${col}" onclick="showLineInfo('${lr}', '${escHtml(ln)}', '${col}')">
      <div class="line-badge" style="background:${col}">${escHtml(ln.length > 5 ? ln.substring(0,5) : ln)}</div>
      <div class="route-info">
        <div class="route-name">${escHtml(ln)}</div>
        <div class="route-sub">${escHtml(sub)}</div>
      </div>
      ${cnt ? `<div class="route-vehicles">${cnt} רכב</div>` : ''}
    </div>`;
  });

  openPanel(`מסלול מ-${olabel}`, html);
}

function getOpId(opName) {
  for (const [id, name] of Object.entries(OP_NAMES)) {
    if (name === opName) return id;
  }
  return '';
}

// ── Show line stops ───────────────────────────────────────────────
function showLineInfo(lineRef, lineName, col) {
  openPanel(`קו ${lineName}`, '<div class="loader"><div class="spinner"></div>טוען תחנות...</div>');
  currentView = 'stops';

  fetch(`${API}/line_info?line_ref=${encodeURIComponent(lineRef)}`)
    .then(r => r.json())
    .then(data => {
      const dirs = data.directions || [];
      const vehs = data.vehicles   || [];
      const operator = data.operator || '';

      if (!dirs.length) {
        openPanel(`קו ${lineName}`, `<div class="empty-state"><div class="icon">&#x1F645;</div><div>לא נמצאו תחנות לקו ${lineName}</div></div>`);
        return;
      }

      let html = '';

      // Vehicles bar
      if (vehs.length) {
        html += `<div class="veh-bar">&#x1F68C; ${vehs.length} כלי רכב בשטח — ${operator}</div>`;
        // Show vehicles on map
        clearStopMarkers();
        vehs.forEach(v => {
          const mk = L.circleMarker([v.lat, v.lon], {
            radius: 7, fillColor: col, color: 'white', weight: 2, fillOpacity: 0.9,
          }).addTo(map);
          mk.bindTooltip(`קו ${lineName} — ${v.vel || 0} קמ"ש`, { direction: 'top' });
          stopMarkers.push(mk);
        });
      }

      // Direction tabs if 2 directions
      if (dirs.length > 1) {
        html += `<div class="dir-tabs">`;
        dirs.forEach((d, i) => {
          html += `<button class="dir-tab${i===0?' active':''}" onclick="switchDir(this, ${i}, '${col}')">${d.first_stop} ← ${d.last_stop}</button>`;
        });
        html += `</div>`;
      }

      // Stop lists
      dirs.forEach((d, di) => {
        html += `<div class="dir-stops" id="dir-${di}" style="${di>0?'display:none':''}">`;
        d.stops.forEach((s, si) => {
          html += `<div class="stop-item">
            <div class="stop-num" style="background:${col}">${si+1}</div>
            <div class="stop-name">${escHtml(s.name)}</div>
          </div>`;
        });
        html += `</div>`;
      });

      openPanel(`קו ${lineName}`, html);

      // Fit map to stops
      const coords = dirs[0].stops.filter(s => s.lat && s.lon).map(s => [s.lat, s.lon]);
      if (coords.length > 1) {
        map.fitBounds(coords, { padding: [60, 60], maxZoom: 14 });
        dirs[0].stops.filter(s => s.lat && s.lon).forEach((s, si) => {
          const mk = L.circleMarker([s.lat, s.lon], {
            radius: 4, fillColor: col, color: 'white', weight: 1.5, fillOpacity: 0.85,
          }).addTo(map);
          mk.bindTooltip(`${si+1}. ${s.name}`, { direction: 'top' });
          stopMarkers.push(mk);
        });
      }
    })
    .catch(() => openPanel(`קו ${lineName}`, '<div class="empty-state"><div class="icon">&#x26A0;</div><div>שגיאה בטעינת תחנות</div></div>'));
}

function switchDir(btn, idx, col) {
  document.querySelectorAll('.dir-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.dir-stops').forEach((el, i) => {
    el.style.display = i === idx ? '' : 'none';
  });
}

// ── Tap on map → nearby ───────────────────────────────────────────
map.on('click', e => {
  const { lat, lng } = e.latlng;
  showNearbyAt(lat, lng, `${lat.toFixed(4)}, ${lng.toFixed(4)}`);
});

// ── Utilities ─────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
