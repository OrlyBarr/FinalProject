<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>סוכן תחבורה — גוש דן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0d0f18;--surf:#161924;--surf2:#1e2235;--border:#272d45;
  --accent:#3b82f6;--acc2:#60a5fa;--green:#22c55e;--red:#ef4444;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text)}

/* ── Layout ── */
header{height:50px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:100}
.logo-ico{width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.logo-txt{font-weight:700;font-size:.9rem}
.logo-sub{font-size:.62rem;color:var(--text3)}
.pill{margin-right:auto;display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.68rem;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.layout{display:flex;height:calc(100vh - 50px);overflow:hidden}

/* ── Map panel ── */
.map-panel{
  width:52%;flex-shrink:0;
  display:flex;flex-direction:column;
  border-left:1px solid var(--border);
  position:relative;
}
#map{flex:1;background:#1a1f35}
.map-bar{
  height:38px;background:var(--surf);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0;
}
.map-bar input{
  flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:8px;
  padding:4px 10px;color:var(--text);font-family:'Heebo',sans-serif;font-size:.78rem;
  outline:none;direction:rtl;
}
.map-bar input:focus{border-color:var(--accent)}
.map-btn{
  background:var(--accent);border:none;border-radius:7px;
  padding:4px 10px;color:#fff;font-family:'Heebo',sans-serif;
  font-size:.75rem;cursor:pointer;white-space:nowrap;
}
.map-btn.sec{background:var(--surf2);border:1px solid var(--border);color:var(--text2)}
.map-btn.sec:hover{background:var(--border)}
#bus-count{font-size:.7rem;color:var(--text3)}

/* ── Chat panel ── */
.chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}

.quick-bar{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:7px 12px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;
}
.qbtn{
  background:var(--surf2);border:1px solid var(--border);border-radius:20px;
  padding:4px 11px;color:var(--text2);font-family:'Heebo',sans-serif;
  font-size:.73rem;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.qbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

.chat{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.msg{display:flex;gap:8px;max-width:92%;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.bot{align-self:flex-end}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.user .av{background:#1e3a5f}
.msg.bot  .av{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.bbl{padding:9px 13px;border-radius:var(--r);font-size:.84rem;line-height:1.65}
.msg.user .bbl{background:#1a3050;border:1px solid #2a4a7f;border-radius:var(--r) 4px var(--r) var(--r)}
.msg.bot  .bbl{background:var(--surf);border:1px solid var(--border);border-radius:4px var(--r) var(--r) var(--r)}

.typing{display:flex;gap:4px;align-items:center;padding:2px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce .7s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-4px);background:var(--accent)}}

.src-badge{font-size:.6rem;color:var(--text3);margin-top:4px;text-align:left}

.input-wrap{background:var(--surf);border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0}
.input-row{display:flex;gap:7px;align-items:flex-end;background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:6px 6px 6px 11px;transition:border-color .15s}
.input-row:focus-within{border-color:var(--accent)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Heebo',sans-serif;font-size:.85rem;resize:none;max-height:80px;min-height:20px;line-height:1.5;direction:rtl}
textarea::placeholder{color:var(--text3)}
.send-btn{width:32px;height:32px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;flex-shrink:0;color:#fff}
.send-btn:hover{background:var(--acc2);transform:scale(1.05)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 11px;color:var(--red);font-size:.8rem}

.welcome{margin:auto;text-align:center;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.w-ico{width:56px;height:56px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.w-title{font-size:1.1rem;font-weight:700}
.w-desc{font-size:.8rem;color:var(--text2);max-width:300px;line-height:1.6}

/* Leaflet overrides for dark theme */
.leaflet-container{background:#1a1f35;font-family:'Heebo',sans-serif}
.leaflet-popup-content-wrapper{
  background:var(--surf);border:1px solid var(--border);
  color:var(--text);border-radius:10px;direction:rtl;
  font-family:'Heebo',sans-serif;font-size:13px;
}
.leaflet-popup-tip{background:var(--surf)}
.leaflet-popup-close-button{color:var(--text2)!important}
.leaflet-control-zoom a{background:var(--surf2)!important;border-color:var(--border)!important;color:var(--text)!important}
.leaflet-control-zoom a:hover{background:var(--border)!important}
.leaflet-control-attribution{background:rgba(13,15,24,.7)!important;color:var(--text3)!important;font-size:.55rem!important}
</style>
</head>
<body>

<header>
  <div class="logo-ico">🚌</div>
  <div>
    <div class="logo-txt">סוכן תחבורה — גוש דן</div>
    <div class="logo-sub">OpenStreetMap + Stride API + GTFS</div>
  </div>
  <div class="pill"><span class="dot"></span><span id="status-txt">מתחבר...</span></div>
</header>

<div class="layout">

  <!-- ── Map panel ── -->
  <div class="map-panel">
    <div id="map"></div>
    <div class="map-bar">
      <input id="addr-inp" placeholder="הזיני כתובת לחיפוש תחנות קרובות..." onkeydown="if(event.key==='Enter')searchAddress()"/>
      <button class="map-btn" onclick="searchAddress()">🔍 חיפוש</button>
      <button class="map-btn sec" onclick="useMyLocation()">📍 מיקום שלי</button>
      <button class="map-btn sec" onclick="refreshBuses()">🔄</button>
      <span id="bus-count"></span>
    </div>
  </div>

  <!-- ── Chat panel ── -->
  <div class="chat-panel">

    <div class="quick-bar">
      <span style="font-size:.65rem;color:var(--text3);align-self:center">שאלות מהירות:</span>
      <button class="qbtn" onclick="promptLine()">🔢 קו מספר</button>
      <button class="qbtn" onclick="ask('קווי דן')">🚌 קווי דן</button>
      <button class="qbtn" onclick="ask('קווי אגד')">🚌 קווי אגד</button>
      <button class="qbtn" onclick="ask('קווי NTA')">🚇 קווי NTA</button>
      <button class="qbtn" onclick="promptAddress()">📍 אוטובוסים ליד כתובת</button>
      <button class="qbtn" onclick="ask('רכבות מתל אביב מרכז')">🚆 רכבות ת"א מרכז</button>
      <button class="qbtn" onclick="ask('רכבות מתל אביב השלום')">🚆 רכבות ת"א השלום</button>
      <button class="qbtn" onclick="useMyLocation(true)">📍 ליד המיקום שלי</button>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="w-ico">🚌</div>
        <div class="w-title">שלום! אני הסוכן שלך לתחבורה</div>
        <div class="w-desc">שאלי על קווי אוטובוס, רכבות, לוחות זמנים ותחנות בגוש דן.<br>השתמשי במפה לחיפוש לפי כתובת.</div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="inp" placeholder="שאלי על קו, תחנה, מפעיל או כתובת..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
        <button class="send-btn" id="sbtn" onclick="sendMsg()">➤</button>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Leaflet Map ─────────────────────────────────────────────────────────────
let lmap, busMarkers = [], nearbyMarkers = [], userMarker = null;

function initMap() {
  lmap = L.map('map', {zoomControl: true}).setView([32.0853, 34.7818], 13);

  // CartoDB Dark Matter tiles — free, no API key
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(lmap);

  // Click on map → find nearby stops
  lmap.on('click', e => {
    fetchNearbyForCoords(e.latlng.lat, e.latlng.lng);
  });

  refreshBuses();
  setInterval(refreshBuses, 30000);
  setStatus('פעיל', true);
}

function makeBusIcon(color = '#3b82f6') {
  return L.circleMarker([0,0], {
    radius: 6, fillColor: color, fillOpacity: 1,
    color: '#fff', weight: 1.5, opacity: 1,
  });
}

async function refreshBuses() {
  try {
    const data = await fetch('/buses').then(r => r.json());
    const buses = Array.isArray(data) ? data : (data.buses || []);

    busMarkers.forEach(m => lmap.removeLayer(m));
    busMarkers = [];

    buses.forEach(b => {
      const lat = parseFloat(b.lat || b.latitude);
      const lon = parseFloat(b.lon || b.longitude);
      if (!lat || !lon) return;

      const line = b.route_short_name || b.line_ref || '?';
      const op   = b.operator_name || '';
      const spd  = b.velocity ? Math.round(b.velocity) + ' קמ"ש' : 'לא ידוע';

      const m = L.circleMarker([lat, lon], {
        radius: 6, fillColor: '#3b82f6', fillOpacity: 1,
        color: '#fff', weight: 1.5,
      }).addTo(lmap);

      m.bindPopup(
        `<div style="direction:rtl;min-width:120px">
          <b>קו ${line}</b><br>
          מפעיל: ${op || '?'}<br>
          מהירות: ${spd}<br>
          <a href="#" onclick="event.preventDefault();window.transitChat('קו ${line}')" style="color:#60a5fa">פרטי קו ▶</a>
        </div>`
      );
      busMarkers.push(m);
    });

    document.getElementById('bus-count').textContent = buses.length ? `🚌 ${buses.length} אוטובוסים` : '';
  } catch(e) {
    document.getElementById('bus-count').textContent = '⚠️ שגיאה בטעינת אוטובוסים';
  }
}

async function searchAddress() {
  const addr = document.getElementById('addr-inp').value.trim();
  if (!addr) return;
  try {
    const geo = await fetch(`/geocode?q=${encodeURIComponent(addr + ', ישראל')}`).then(r => r.json());
    if (!geo.lat) { alert('כתובת לא נמצאה'); return; }
    const lat = parseFloat(geo.lat), lon = parseFloat(geo.lon);
    lmap.setView([lat, lon], 15);
    fetchNearbyForCoords(lat, lon);
    ask(`אוטובוסים ליד ${addr}`);
  } catch(e) { alert('שגיאת גאוקוד: ' + e.message); }
}

async function fetchNearbyForCoords(lat, lon) {
  nearbyMarkers.forEach(m => lmap.removeLayer(m));
  nearbyMarkers = [];
  if (userMarker) lmap.removeLayer(userMarker);

  // Orange marker for selected location
  userMarker = L.circleMarker([lat, lon], {
    radius: 9, fillColor: '#f97316', fillOpacity: 1,
    color: '#fff', weight: 2, zIndexOffset: 999,
  }).addTo(lmap).bindPopup('מיקום נבחר').openPopup();

  try {
    const data = await fetch(`/gtfs/nearby?lat=${lat}&lon=${lon}&radius=500`).then(r => r.json()).catch(() => null);
    const stops = data?.stops || [];
    stops.slice(0, 8).forEach(s => {
      const slat = parseFloat(s.stop_lat || lat);
      const slon = parseFloat(s.stop_lon || lon);
      const lines = (s.routes || []).map(r => `קו ${r.route_short_name}`).join(', ') || 'אין קווים';
      const m = L.circleMarker([slat, slon], {
        radius: 7, fillColor: '#22c55e', fillOpacity: 0.9,
        color: '#fff', weight: 1.5,
      }).addTo(lmap);
      m.bindPopup(
        `<div style="direction:rtl">
          <b>${s.stop_name}</b> (${Math.round(s.distance_m || 0)}מ')<br>${lines}
        </div>`
      );
      nearbyMarkers.push(m);
    });
  } catch(e) {}
}

function useMyLocation(toChat) {
  if (!navigator.geolocation) { alert('הדפדפן לא תומך ב-Geolocation'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lmap.setView([lat, lon], 15);
    fetchNearbyForCoords(lat, lon);
    if (toChat) ask(`אוטובוסים ליד המיקום שלי (${lat.toFixed(4)},${lon.toFixed(4)})`);
  }, () => alert('לא הצלחתי לקבל מיקום'));
}

window.transitChat = q => ask(q);

// ── Chat ────────────────────────────────────────────────────────────────────
let busy = false;
const history = [];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmt(t){
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

function addMsg(role, html) {
  document.getElementById('welcome')?.remove();
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = `<div class="av">${role==='user'?'👤':'🚌'}</div><div class="bbl">${html}</div>`;
  document.getElementById('chat').appendChild(d);
  setTimeout(() => { document.getElementById('chat').scrollTop = 9999; }, 40);
  return d;
}
function addTyping(){ return addMsg('bot','<div class="typing"><span></span><span></span><span></span></div>'); }

function ask(text) {
  document.getElementById('inp').value = text;
  sendMsg();
}

function promptLine() {
  document.getElementById('welcome')?.remove();
  addMsg('bot', 'הזיני מספר קו אוטובוס (לדוגמה: 5, 89, 240):');
  const inp = document.getElementById('inp');
  inp.placeholder = 'מספר קו...';
  inp.focus();
  inp.dataset.mode = 'line';
}

function promptAddress() {
  document.getElementById('welcome')?.remove();
  addMsg('bot', 'הזיני כתובת לחיפוש אוטובוסים קרובים (לדוגמה: רחוב דיזנגוף, תל אביב):');
  const inp = document.getElementById('inp');
  inp.placeholder = 'כתובת לחיפוש...';
  inp.focus();
  inp.dataset.mode = 'address';
}

function setStatus(txt, ok) {
  document.getElementById('status-txt').textContent = txt;
  document.querySelector('.dot').style.background = ok ? '#22c55e' : '#f97316';
}

function srcLabel(src) {
  if (src === 'stride') return '⚡ Stride API (זמן אמת)';
  if (src === 'gtfs')   return '📋 GTFS';
  if (src === 'static') return '📌 נתונים סטטיים';
  if (src === 'gemini') return '🤖 Gemini AI';
  if (src === 'ollama') return '🦙 Ollama';
  return src || '';
}

async function sendMsg() {
  const inp = document.getElementById('inp');
  let text = inp.value.trim();
  if (!text || busy) return;

  // עטוף לפי mode אם פעיל
  if (inp.dataset.mode === 'line') {
    const num = text.replace(/[^\d]/g, '');
    if (!num) { inp.focus(); return; }
    text = `קו ${num}`;
    inp.dataset.mode = '';
    inp.placeholder = 'שאלי על קו, תחנה, מפעיל או כתובת...';
  } else if (inp.dataset.mode === 'address') {
    text = `אוטובוסים ליד ${text}`;
    inp.dataset.mode = '';
    inp.placeholder = 'שאלי על קו, תחנה, מפעיל או כתובת...';
  }

  inp.value = ''; inp.style.height = 'auto';
  busy = true; document.getElementById('sbtn').disabled = true;

  history.push({role: 'user', content: text});
  addMsg('user', esc(text));
  const typing = addTyping();

  // AbortController — 25 שניות מקסימום
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 25000);

  try {
    // שלב 1: smart_ask — ישיר מ-Stride/GTFS ללא AI
    const r1 = await fetch('/smart_ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: ctrl.signal,
      body: JSON.stringify({message: text}),
    });
    const d1 = await r1.json();

    if (d1.reply) {
      clearTimeout(tid);
      typing.remove();
      history.push({role: 'assistant', content: d1.reply});
      const el = addMsg('bot', fmt(d1.reply));
      if (d1.source) {
        const badge = document.createElement('div');
        badge.className = 'src-badge';
        badge.textContent = srcLabel(d1.source);
        el.querySelector('.bbl').appendChild(badge);
      }
      busy = false; document.getElementById('sbtn').disabled = false; inp.focus();
      return;
    }

    // שלב 2: fallback ל-Gemini (שאלות חופשיות)
    const r2 = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: ctrl.signal,
      body: JSON.stringify({messages: history.slice(-6), tool_data: ''}),
    });
    clearTimeout(tid);
    const d2 = await r2.json().catch(() => ({}));
    typing.remove();
    if (!r2.ok || d2.error) throw new Error(d2.error || `HTTP ${r2.status}`);
    const replyText = d2.reply || 'לא התקבלה תשובה';
    history.push({role: 'assistant', content: replyText});
    const el2 = addMsg('bot', fmt(replyText));
    if (d2.source) {
      const badge = document.createElement('div'); badge.className = 'src-badge';
      badge.textContent = srcLabel(d2.source);
      el2.querySelector('.bbl').appendChild(badge);
    }
  } catch(e) {
    clearTimeout(tid);
    typing.remove();
    const isAbort = e.name === 'AbortError';
    addMsg('bot', `<div class="err">⚠️ ${isAbort ? 'timeout — נסי שוב' : esc(e.message)}</div>`);
  }

  busy = false; document.getElementById('sbtn').disabled = false; inp.focus();
}

// Init map on load
window.addEventListener('load', initMap);
</script>
</body>
</html>
