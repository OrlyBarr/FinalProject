<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>סוכן תחבורה — גוש דן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ── NAYA Color Palette ────────────────────────────────────────────────────── */
:root{
  --bg:       #F5F3FF;   /* lavender white */
  --surf:     #FFFFFF;   /* pure white */
  --surf2:    #EDE9FE;   /* violet-100 */
  --border:   #C4B5FD;   /* violet-300 */
  --accent:   #6D28D9;   /* violet-700 — NAYA primary */
  --acc2:     #7C3AED;   /* violet-600 */
  --acc3:     #A78BFA;   /* violet-400 — light accent */
  --gold:     #F59E0B;   /* amber — NAYA secondary */
  --green:    #059669;   /* emerald-600 */
  --red:      #DC2626;
  --text:     #1E1B4B;   /* indigo-950 */
  --text2:    #4C1D95;   /* violet-900 */
  --text3:    #8B8BB0;   /* muted */
  --shadow:   0 2px 12px rgba(109,40,217,.10);
  --shadow2:  0 4px 24px rgba(109,40,217,.18);
  --r:        14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text)}

/* ── Header ─────────────────────────────────────────────────────────────────── */
header{
  height:54px;
  background:linear-gradient(135deg,#5B21B6 0%,#6D28D9 50%,#7C3AED 100%);
  display:flex;align-items:center;padding:0 18px;gap:12px;
  flex-shrink:0;z-index:100;
  box-shadow:0 2px 12px rgba(91,33,182,.35);
}
.logo-ico{
  width:34px;height:34px;
  background:rgba(255,255,255,.2);
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:18px;backdrop-filter:blur(4px);
}
.logo-txt{font-weight:800;font-size:.95rem;color:#fff;letter-spacing:.02em}
.logo-sub{font-size:.62rem;color:rgba(255,255,255,.65);margin-top:1px}
.pill{
  margin-right:auto;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  border-radius:20px;padding:4px 12px;font-size:.7rem;color:#fff;
  backdrop-filter:blur(4px);
}
.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Layout ─────────────────────────────────────────────────────────────────── */
.layout{display:flex;height:calc(100vh - 54px);overflow:hidden}

/* ── Map panel ──────────────────────────────────────────────────────────────── */
.map-panel{
  width:52%;flex-shrink:0;
  display:flex;flex-direction:column;
  border-left:1px solid var(--border);
}
#map{flex:1;background:#E8E4F8}
.map-bar{
  height:42px;background:var(--surf);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0;
  box-shadow:0 -2px 8px rgba(109,40,217,.06);
}
.map-bar input{
  flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:10px;
  padding:5px 12px;color:var(--text);font-family:'Heebo',sans-serif;font-size:.78rem;
  outline:none;direction:rtl;transition:border-color .15s;
}
.map-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.map-btn{
  background:var(--accent);border:none;border-radius:9px;
  padding:5px 12px;color:#fff;font-family:'Heebo',sans-serif;
  font-size:.75rem;cursor:pointer;white-space:nowrap;transition:all .15s;
  font-weight:600;
}
.map-btn:hover{background:var(--acc2);box-shadow:var(--shadow)}
.map-btn.sec{
  background:var(--surf2);border:1px solid var(--border);
  color:var(--text2);font-weight:500;
}
.map-btn.sec:hover{background:var(--border);color:var(--accent)}
#bus-count{font-size:.7rem;color:var(--text3);white-space:nowrap}

/* ── Chat panel ─────────────────────────────────────────────────────────────── */
.chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

.quick-bar{
  background:var(--surf);border-bottom:1px solid var(--border);
  padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;
  box-shadow:0 2px 8px rgba(109,40,217,.06);
}
.qlabel{font-size:.66rem;color:var(--text3);align-self:center;font-weight:500;margin-left:4px}
.qbtn{
  background:var(--surf);border:1.5px solid var(--border);border-radius:20px;
  padding:5px 13px;color:var(--text2);font-family:'Heebo',sans-serif;
  font-size:.73rem;cursor:pointer;transition:all .18s;white-space:nowrap;
  font-weight:500;box-shadow:0 1px 3px rgba(109,40,217,.08);
}
.qbtn:hover{
  background:var(--accent);border-color:var(--accent);
  color:#fff;box-shadow:var(--shadow);transform:translateY(-1px);
}
.qbtn:active{transform:translateY(0)}

/* ── Chat messages ──────────────────────────────────────────────────────────── */
.chat{
  flex:1;overflow-y:auto;padding:16px 18px;
  display:flex;flex-direction:column;gap:14px;
}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.chat::-webkit-scrollbar-track{background:transparent}

.msg{display:flex;gap:8px;max-width:93%;animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.bot{align-self:flex-end}

.av{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;margin-top:2px;
}
.msg.user .av{background:var(--surf2);border:1.5px solid var(--border)}
.msg.bot  .av{
  background:linear-gradient(135deg,#6D28D9,#A78BFA);
  box-shadow:0 2px 8px rgba(109,40,217,.3);
}

.bbl{
  padding:10px 14px;border-radius:var(--r);
  font-size:.85rem;line-height:1.7;
}
.msg.user .bbl{
  background:var(--surf2);
  border:1.5px solid var(--border);
  border-radius:var(--r) 4px var(--r) var(--r);
  color:var(--text2);
}
.msg.bot .bbl{
  background:var(--surf);
  border:1.5px solid var(--border);
  border-radius:4px var(--r) var(--r) var(--r);
  box-shadow:var(--shadow);
  color:var(--text);
}
.msg.bot .bbl strong{color:var(--accent);font-weight:700}

.typing{display:flex;gap:5px;align-items:center;padding:3px 0}
.typing span{
  width:7px;height:7px;border-radius:50%;
  background:var(--acc3);animation:bounce .7s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-5px);background:var(--accent)}}

.src-badge{
  font-size:.62rem;color:var(--text3);margin-top:5px;
  display:flex;align-items:center;gap:3px;
}

/* ── Input ──────────────────────────────────────────────────────────────────── */
.input-wrap{
  background:var(--surf);border-top:1px solid var(--border);
  padding:11px 14px;flex-shrink:0;
  box-shadow:0 -2px 12px rgba(109,40,217,.08);
}
.input-row{
  display:flex;gap:8px;align-items:flex-end;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:7px 7px 7px 14px;
  transition:border-color .18s,box-shadow .18s;
}
.input-row:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(109,40,217,.12);
}
textarea{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:'Heebo',sans-serif;
  font-size:.86rem;resize:none;max-height:80px;min-height:22px;
  line-height:1.5;direction:rtl;
}
textarea::placeholder{color:var(--text3)}
.send-btn{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#6D28D9,#7C3AED);
  border:none;cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;transition:all .18s;
  flex-shrink:0;color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.3);
}
.send-btn:hover{transform:scale(1.06);box-shadow:var(--shadow2)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Misc ───────────────────────────────────────────────────────────────────── */
.err{
  background:rgba(220,38,38,.07);border:1.5px solid rgba(220,38,38,.25);
  border-radius:10px;padding:8px 12px;color:var(--red);font-size:.82rem;
}
.welcome{
  margin:auto;text-align:center;padding:28px 20px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.w-ico{
  width:62px;height:62px;
  background:linear-gradient(135deg,#6D28D9,#A78BFA);
  border-radius:18px;display:flex;align-items:center;
  justify-content:center;font-size:28px;
  animation:float 3s ease-in-out infinite;
  box-shadow:0 8px 24px rgba(109,40,217,.3);
}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-7px)}}
.w-title{font-size:1.15rem;font-weight:800;color:var(--text)}
.w-desc{font-size:.82rem;color:var(--text3);max-width:280px;line-height:1.7}
.w-hint{
  font-size:.75rem;color:var(--acc2);font-weight:600;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;padding:5px 12px;margin-top:4px;
}

/* ── Leaflet light theme overrides ─────────────────────────────────────────── */
.leaflet-container{background:#E8E4F8;font-family:'Heebo',sans-serif}
.leaflet-popup-content-wrapper{
  background:var(--surf);border:1.5px solid var(--border);
  color:var(--text);border-radius:12px;direction:rtl;
  font-family:'Heebo',sans-serif;font-size:13px;
  box-shadow:var(--shadow2);
}
.leaflet-popup-tip{background:var(--surf)}
.leaflet-popup-close-button{color:var(--text3)!important;font-size:16px!important}
.leaflet-control-zoom a{
  background:var(--surf)!important;border-color:var(--border)!important;
  color:var(--accent)!important;font-weight:700!important;
}
.leaflet-control-zoom a:hover{background:var(--surf2)!important}
.leaflet-control-attribution{
  background:rgba(245,243,255,.85)!important;
  color:var(--text3)!important;font-size:.55rem!important;
}
</style>
</head>
<body>

<header>
  <div class="logo-ico">🚌</div>
  <div>
    <div class="logo-txt">סוכן תחבורה — גוש דן</div>
    <div class="logo-sub">OpenStreetMap · Stride API · GTFS</div>
  </div>
  <div class="pill"><span class="dot"></span><span id="status-txt">מתחבר...</span></div>
</header>

<div class="layout">

  <!-- ── Map panel ── -->
  <div class="map-panel">
    <div id="map"></div>
    <div class="map-bar">
      <input id="addr-inp" placeholder="הזיני כתובת לחיפוש תחנות קרובות..."
             onkeydown="if(event.key==='Enter')searchAddress()"/>
      <button class="map-btn" onclick="searchAddress()">🔍 חיפוש</button>
      <button class="map-btn sec" onclick="useMyLocation()">📍 מיקום</button>
      <button class="map-btn sec" onclick="refreshBuses()">🔄</button>
      <span id="bus-count"></span>
    </div>
  </div>

  <!-- ── Chat panel ── -->
  <div class="chat-panel">

    <div class="quick-bar">
      <span class="qlabel">שאלות מהירות:</span>
      <button class="qbtn" onclick="promptLine()">🔢 קו מספר</button>
      <button class="qbtn" onclick="ask('קווי דן')">🚌 קווי דן</button>
      <button class="qbtn" onclick="ask('קווי אגד')">🚌 קווי אגד</button>
      <button class="qbtn" onclick="ask('קווי NTA')">🚇 קווי NTA</button>
      <button class="qbtn" onclick="promptAddress()">📍 אוטובוסים ליד כתובת</button>
      <button class="qbtn" onclick="ask('רכבות מתל אביב מרכז')">🚆 רכבות ת"א מרכז</button>
      <button class="qbtn" onclick="ask('רכבות מתל אביב השלום')">🚆 רכבות ת"א השלום</button>
      <button class="qbtn" onclick="useMyLocation(true)">📍 ליד המיקום שלי</button>
    </div>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="w-ico">🚌</div>
        <div class="w-title">שלום! אני הסוכן שלך לתחבורה</div>
        <div class="w-desc">שאלי על קווי אוטובוס, רכבות, לוחות זמנים ותחנות בגוש דן</div>
        <div class="w-hint">💡 לתחנות קו: כתבי "תחנות קו 63"</div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="inp" placeholder="שאלי על קו, תחנה, מפעיל או כתובת..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"></textarea>
        <button class="send-btn" id="sbtn" onclick="sendMsg()">➤</button>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Leaflet Map (CartoDB Positron — light theme) ─────────────────────────────
let lmap, busMarkers = [], nearbyMarkers = [], userMarker = null;

function initMap() {
  lmap = L.map('map', {zoomControl: true}).setView([32.0853, 34.7818], 13);

  // CartoDB Positron light tiles — free, no API key
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(lmap);

  lmap.on('click', e => fetchNearbyForCoords(e.latlng.lat, e.latlng.lng));

  refreshBuses();
  setInterval(refreshBuses, 30000);
  setStatus('פעיל', true);
}

async function refreshBuses() {
  try {
    const data = await fetch('/buses').then(r => r.json());
    const buses = Array.isArray(data) ? data : (data.buses || []);

    busMarkers.forEach(m => lmap.removeLayer(m));
    busMarkers = [];

    buses.forEach(b => {
      const lat = parseFloat(b.lat || b.latitude);
      const lon = parseFloat(b.lon || b.longitude);
      if (!lat || !lon) return;
      const line = b.route_short_name || b.line_ref || '?';
      const op   = b.operator_name || '';
      const spd  = b.velocity ? Math.round(b.velocity) + ' קמ"ש' : 'לא ידוע';

      const m = L.circleMarker([lat, lon], {
        radius: 7, fillColor: '#6D28D9', fillOpacity: .85,
        color: '#fff', weight: 2,
      }).addTo(lmap);

      m.bindPopup(
        `<div style="direction:rtl;min-width:130px;font-family:Heebo,sans-serif">
          <b style="color:#6D28D9">קו ${line}</b><br>
          מפעיל: ${op || '?'}<br>
          מהירות: ${spd}<br>
          <a href="#" onclick="event.preventDefault();window.transitChat('קו ${line}')"
             style="color:#7C3AED;font-weight:600">פרטי קו ▶</a>
        </div>`
      );
      busMarkers.push(m);
    });

    document.getElementById('bus-count').textContent =
      buses.length ? `🚌 ${buses.length} אוטובוסים` : '';
  } catch(e) {
    document.getElementById('bus-count').textContent = '⚠️ שגיאה';
  }
}

async function searchAddress() {
  const addr = document.getElementById('addr-inp').value.trim();
  if (!addr) return;
  try {
    const geo = await fetch(`/geocode?q=${encodeURIComponent(addr + ', ישראל')}`).then(r => r.json());
    if (!geo.lat) { alert('כתובת לא נמצאה'); return; }
    const lat = parseFloat(geo.lat), lon = parseFloat(geo.lon);
    lmap.setView([lat, lon], 15);
    fetchNearbyForCoords(lat, lon);
    ask(`אוטובוסים ליד ${addr}`);
  } catch(e) { alert('שגיאת גאוקוד: ' + e.message); }
}

async function fetchNearbyForCoords(lat, lon) {
  nearbyMarkers.forEach(m => lmap.removeLayer(m));
  nearbyMarkers = [];
  if (userMarker) lmap.removeLayer(userMarker);

  userMarker = L.circleMarker([lat, lon], {
    radius: 10, fillColor: '#F59E0B', fillOpacity: .9,
    color: '#fff', weight: 2.5, zIndexOffset: 999,
  }).addTo(lmap).bindPopup('<div style="direction:rtl">📍 מיקום נבחר</div>').openPopup();

  try {
    const data = await fetch(`/gtfs/nearby?lat=${lat}&lon=${lon}&radius=500`)
      .then(r => r.json()).catch(() => null);
    const stops = data?.stops || [];
    stops.slice(0, 8).forEach(s => {
      const slat = parseFloat(s.stop_lat || lat);
      const slon = parseFloat(s.stop_lon || lon);
      const lines = (s.routes || []).map(r => `קו ${r.route_short_name}`).join(', ') || 'אין קווים';
      const m = L.circleMarker([slat, slon], {
        radius: 8, fillColor: '#059669', fillOpacity: .85,
        color: '#fff', weight: 2,
      }).addTo(lmap);
      m.bindPopup(
        `<div style="direction:rtl;font-family:Heebo,sans-serif">
          <b>${s.stop_name}</b><br>
          📏 ${Math.round(s.distance_m || 0)} מ'<br>
          ${lines}
        </div>`
      );
      nearbyMarkers.push(m);
    });
  } catch(e) {}
}

function useMyLocation(toChat) {
  if (!navigator.geolocation) { alert('הדפדפן לא תומך ב-Geolocation'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    lmap.setView([lat, lon], 15);
    fetchNearbyForCoords(lat, lon);
    if (toChat) ask(`אוטובוסים ליד המיקום שלי (${lat.toFixed(4)},${lon.toFixed(4)})`);
  }, () => alert('לא הצלחתי לקבל מיקום'));
}

window.transitChat = q => ask(q);

// ── Chat ─────────────────────────────────────────────────────────────────────
let busy = false;
const history = [];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmt(t){
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}

function addMsg(role, html) {
  document.getElementById('welcome')?.remove();
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.innerHTML = `<div class="av">${role==='user'?'👤':'🚌'}</div><div class="bbl">${html}</div>`;
  document.getElementById('chat').appendChild(d);
  setTimeout(() => { document.getElementById('chat').scrollTop = 9999; }, 40);
  return d;
}
function addTyping(){ return addMsg('bot','<div class="typing"><span></span><span></span><span></span></div>'); }

function ask(text) {
  document.getElementById('inp').value = text;
  sendMsg();
}

function promptLine() {
  document.getElementById('welcome')?.remove();
  addMsg('bot', 'הזיני מספר קו אוטובוס (לדוגמה: 5, 89, 240):<br><small style="color:var(--text3)">💡 לתחנות הקו כתבי "תחנות קו [מספר]"</small>');
  const inp = document.getElementById('inp');
  inp.placeholder = 'מספר קו...';
  inp.focus();
  inp.dataset.mode = 'line';
}

function promptAddress() {
  document.getElementById('welcome')?.remove();
  addMsg('bot', 'הזיני כתובת לחיפוש אוטובוסים קרובים:<br><small style="color:var(--text3)">לדוגמה: דיזנגוף 50, תל אביב</small>');
  const inp = document.getElementById('inp');
  inp.placeholder = 'כתובת לחיפוש...';
  inp.focus();
  inp.dataset.mode = 'address';
}

function setStatus(txt, ok) {
  document.getElementById('status-txt').textContent = txt;
  document.querySelector('.dot').style.background = ok ? '#4ADE80' : '#FCD34D';
}

function srcLabel(src) {
  if (src === 'stride') return '⚡ Stride API — זמן אמת';
  if (src === 'gtfs')   return '📋 GTFS';
  if (src === 'static') return '📌 נתונים סטטיים';
  if (src === 'gemini') return '🤖 Gemini AI';
  if (src === 'ollama') return '🦙 Ollama';
  if (src === 'error')  return '⚠️ שגיאה חלקית';
  return src || '';
}

async function sendMsg() {
  const inp = document.getElementById('inp');
  let text = inp.value.trim();
  if (!text || busy) return;

  if (inp.dataset.mode === 'line') {
    const num = text.replace(/[^\d]/g, '');
    if (!num) { inp.focus(); return; }
    text = `קו ${num}`;
    inp.dataset.mode = '';
    inp.placeholder = 'שאלי על קו, תחנה, מפעיל או כתובת...';
  } else if (inp.dataset.mode === 'address') {
    text = `אוטובוסים ליד ${text}`;
    inp.dataset.mode = '';
    inp.placeholder = 'שאלי על קו, תחנה, מפעיל או כתובת...';
  }

  inp.value = ''; inp.style.height = 'auto';
  busy = true; document.getElementById('sbtn').disabled = true;

  history.push({role: 'user', content: text});
  addMsg('user', esc(text));
  const typing = addTyping();

  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 25000);

  try {
    // שלב 1 — smart_ask: ישיר מ-Stride/GTFS, ללא AI
    const r1 = await fetch('/smart_ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: ctrl.signal,
      body: JSON.stringify({message: text}),
    });
    const d1 = await r1.json();

    if (d1.reply) {
      clearTimeout(tid);
      typing.remove();
      history.push({role: 'assistant', content: d1.reply});
      const el = addMsg('bot', fmt(d1.reply));
      if (d1.source) {
        const badge = document.createElement('div');
        badge.className = 'src-badge';
        badge.textContent = srcLabel(d1.source);
        el.querySelector('.bbl').appendChild(badge);
      }
      busy = false; document.getElementById('sbtn').disabled = false; inp.focus();
      return;
    }

    // שלב 2 — fallback לGemini (שאלות חופשיות)
    const r2 = await fetch('/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      signal: ctrl.signal,
      body: JSON.stringify({messages: history.slice(-6), tool_data: ''}),
    });
    clearTimeout(tid);
    const d2 = await r2.json().catch(() => ({}));
    typing.remove();
    if (!r2.ok || d2.error) throw new Error(d2.error || `HTTP ${r2.status}`);
    const replyText = d2.reply || 'לא התקבלה תשובה';
    history.push({role: 'assistant', content: replyText});
    const el2 = addMsg('bot', fmt(replyText));
    if (d2.source) {
      const badge = document.createElement('div'); badge.className = 'src-badge';
      badge.textContent = srcLabel(d2.source);
      el2.querySelector('.bbl').appendChild(badge);
    }
  } catch(e) {
    clearTimeout(tid);
    typing.remove();
    const isAbort = e.name === 'AbortError';
    addMsg('bot', `<div class="err">⚠️ ${isAbort ? 'timeout — נסי שוב' : esc(e.message)}</div>`);
  }

  busy = false; document.getElementById('sbtn').disabled = false; inp.focus();
}

window.addEventListener('load', initMap);
</script>
</body>
</html>
