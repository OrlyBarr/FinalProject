<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Transit IL — סוכן AI</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0f18;--surf:#161924;--surf2:#1e2235;--border:#272d45;
  --accent:#3b82f6;--acc2:#60a5fa;
  --green:#22c55e;--orange:#f97316;--red:#ef4444;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#475569;
  --r:14px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;display:flex;flex-direction:column;height:100vh}

/* Header */
header{background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.logo{display:flex;align-items:center;gap:9px}
.logo-ico{width:34px;height:34px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-txt{font-weight:700;font-size:.9rem}
.logo-sub{font-size:.66rem;color:var(--text3)}
.pill{display:flex;align-items:center;gap:5px;background:var(--surf2);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:.7rem;color:var(--text2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Layout: sidebar + main */
.layout{display:flex;flex:1;overflow:hidden}

/* Sidebar — quick questions */
.sidebar{
  width:220px;flex-shrink:0;
  background:var(--surf);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
  transition:width .3s;
}
.sidebar.collapsed{width:0;border:none}
.sidebar-head{
  padding:12px 14px 8px;
  font-size:.7rem;font-weight:700;
  color:var(--text3);text-transform:uppercase;letter-spacing:.06em;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.sidebar-toggle{
  background:none;border:none;color:var(--text3);cursor:pointer;
  font-size:14px;padding:2px 4px;border-radius:4px;
  transition:color .15s;
}
.sidebar-toggle:hover{color:var(--text)}
.sidebar-list{
  flex:1;overflow-y:auto;padding:0 8px 12px;
}
.sidebar-list::-webkit-scrollbar{width:3px}
.sidebar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.q-item{
  background:none;border:none;
  width:100%;text-align:right;
  padding:8px 10px;
  border-radius:var(--rsm);
  font-family:'Heebo',sans-serif;
  font-size:.78rem;color:var(--text2);
  cursor:pointer;
  transition:all .15s;
  margin-bottom:3px;
  display:flex;align-items:flex-start;gap:6px;
  line-height:1.4;
}
.q-item:hover{background:var(--surf2);color:var(--text)}
.q-item .q-ico{font-size:13px;flex-shrink:0;margin-top:1px}
.q-divider{height:1px;background:var(--border);margin:8px 4px}
.q-section{font-size:.65rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px}

/* Chat area */
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Messages */
.msg{display:flex;gap:9px;max-width:88%;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.bot{align-self:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.msg.user .avatar{background:#1e3a5f}
.msg.bot .avatar{background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 2px 8px rgba(59,130,246,.25)}
.bubble{padding:10px 14px;border-radius:var(--r);font-size:.86rem;line-height:1.65}
.msg.user .bubble{background:#1a3050;border:1px solid #2a4a7f;border-radius:var(--r) 4px var(--r) var(--r)}
.msg.bot .bubble{background:var(--surf);border:1px solid var(--border);border-radius:4px var(--r) var(--r) var(--r)}

/* Typing */
.typing{display:flex;gap:4px;align-items:center;padding:2px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:bounce .75s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-5px);background:var(--accent)}}

/* Input */
.input-wrap{background:var(--surf);border-top:1px solid var(--border);padding:11px 16px;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end;background:var(--surf2);border:1px solid var(--border);border-radius:12px;padding:7px 7px 7px 13px;transition:border-color .18s}
.input-row:focus-within{border-color:var(--accent)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Heebo',sans-serif;font-size:.88rem;resize:none;max-height:90px;min-height:22px;line-height:1.5;direction:rtl}
textarea::placeholder{color:var(--text3)}
.send{width:34px;height:34px;border-radius:9px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .18s;flex-shrink:0}
.send:hover{background:var(--acc2);transform:scale(1.05)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* Welcome */
.welcome{margin:auto;text-align:center;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:13px}
.w-icon{width:64px;height:64px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 28px rgba(59,130,246,.3);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-7px)}}
.w-title{font-size:1.2rem;font-weight:700}
.w-desc{font-size:.84rem;color:var(--text2);max-width:360px;line-height:1.6}

/* Error */
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--rsm);padding:9px 12px;color:var(--red);font-size:.82rem;margin-top:8px}

/* Sidebar toggle button (when collapsed) */
.open-sidebar{
  position:absolute;left:12px;bottom:70px;
  width:32px;height:32px;
  background:var(--surf2);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  font-size:14px;color:var(--text2);
  transition:all .15s;z-index:5;
}
.open-sidebar:hover{background:var(--border);color:var(--text)}
.sidebar.collapsed ~ .chat-wrap .open-sidebar{display:flex}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-ico">🚌</div>
    <div>
      <div class="logo-txt">סוכן תחבורה — גוש דן</div>
      <div class="logo-sub">Claude AI + Google Maps + GTFS</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="pill"><span class="dot"></span>פעיל</div>
    <button onclick="toggleSidebar()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px" title="שאלות מהירות">☰</button>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      שאלות מהירות
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="סגור">✕</button>
    </div>
    <div class="sidebar-list" id="qlist">
      <div class="q-section">🚌 אוטובוסים</div>
      <button class="q-item" onclick="startFlow('address_buses')"><span class="q-ico">📍</span>אוטובוסים ליד כתובת</button>
      <button class="q-item" onclick="startFlow('dan_line')"><span class="q-ico">🏢</span>קווי דן</button>
      <button class="q-item" onclick="startFlow('nta_line')"><span class="q-ico">🏢</span>קווי NTA</button>
      <button class="q-item" onclick="startFlow('egged_line')"><span class="q-ico">🏢</span>קווי אגד</button>
      <div class="q-divider"></div>
      <div class="q-section">🚆 רכבת</div>
      <button class="q-item" onclick="startFlow('train_ta_merkaz')"><span class="q-ico">⏱️</span>רכבות מת"א מרכז</button>
      <button class="q-item" onclick="startFlow('train_ta_shalom')"><span class="q-ico">⏱️</span>רכבות מת"א השלום</button>
      <button class="q-item" onclick="startFlow('train_station')"><span class="q-ico">🚉</span>תחנת רכבת</button>
      <div class="q-divider"></div>
      <div class="q-section">🗺️ כללי</div>
      <button class="q-item" onclick="startFlow('route_plan')"><span class="q-ico">🧭</span>מיקום נוכחי → יעד</button>
      <button class="q-item" onclick="startFlow('travel_time')"><span class="q-ico">⏱️</span>זמן נסיעה</button>
      <button class="q-item" onclick="startFlow('operators_list')"><span class="q-ico">📋</span>רשימת מפעילים</button>
    </div>
  </div>

  <!-- Main chat -->
  <div class="chat-wrap">
    <button class="open-sidebar" onclick="toggleSidebar()" title="שאלות מהירות">☰</button>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="w-icon">🚌</div>
        <div class="w-title">שלום! אני הסוכן שלך לתחבורה</div>
        <div class="w-desc">שאלי אותי בחופשיות על אוטובוסים, רכבות, קווים ותחנות בגוש דן. אענה בדיוק כמו Google Maps — רק בשיחה.</div>
      </div>
    </div>

    <div class="input-wrap">
      <div class="input-row">
        <textarea id="inp" placeholder="שאלי על תחבורה ציבורית בגוש דן..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,90)+'px'"></textarea>
        <button class="send" id="sbtn" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>

</div>

<script>
const GTFS   = "/gtfs";
const STRIDE = "/proxy/stride";

let history      = [];
let busy         = false;
let gtfsOk       = false;
let recentQs     = [];
let pendingFlow  = null;   // שם הפלואו הנוכחי
let pendingData  = {};     // נתונים שנאספו (למשל קואורדינטות)

fetch(`${GTFS}/status`).then(r=>r.json()).then(d=>{ gtfsOk=d.available; }).catch(()=>{});

// Sidebar
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

// ── Conversational flows ─────────────────────────────────
function startFlow(type) {
  document.getElementById("welcome")?.remove();
  pendingFlow = type;
  pendingData = {};

  const questions = {
    address_buses:   "📍 בשמחה! מה הכתובת שאת מחפשת אוטובוסים בקרבתה?\n*(לדוגמה: דיזנגוף 50 תל אביב)*",
    dan_line:        "🚌 **קווי דן** — הזיני מספר קו לפרטים (לדוגמה: 5, 89, 240)\nאו כתבי **כל הקווים** לרשימה מלאה.",
    nta_line:        "🚇 **קווי NTA מטרופולין** — הזיני מספר קו\nאו כתבי **כל הקווים** לרשימה מלאה.",
    egged_line:      "🚌 **קווי אגד** — הזיני מספר קו\nאו כתבי **כל הקווים** לרשימה מלאה.",
    train_ta_merkaz: "⏱️ **תל אביב מרכז** — מתי תרצי לנסוע? (ניתן לכתוב \"עכשיו\" או שעה ספציפית)",
    train_ta_shalom: "⏱️ **תל אביב השלום** — מתי תרצי לנסוע? (ניתן לכתוב \"עכשיו\" או שעה ספציפית)",
    train_station:   "🚉 **תחנת רכבת** — איזו תחנה מעניינת אותך?\n(ת\"א מרכז, השלום, הגנה, אוניברסיטה, בני ברק...)",
    travel_time:     "⏱️ **זמן נסיעה** — מאיפה לאיפה?\n*(לדוגמה: מתל אביב לרמת גן)*",
    operators_list:  "📋 **מפעילי אוטובוסים** — האם תרצי מידע על מפעיל ספציפי?\nמפעילים: דן, אגד, NTA, סופרבוס, קווים, נתיב אקספרס",
    route_plan:      "🧭 **תכנון מסלול** — לאן את רוצה להגיע?\n*(מאתרת מיקום נוכחי...)*",
  };

  addMsg("bot", fmt(questions[type] || "במה אוכל לעזור?"));

  // מיקום נוכחי — בקש GPS מהדפדפן
  if (type === "route_plan") {
    if (!navigator.geolocation) {
      pendingFlow = "route_plan_manual";
      addMsg("bot", fmt("⚠️ הדפדפן לא תומך ב-Geolocation. הזיני כתובת מוצא ידנית."));
    } else {
      navigator.geolocation.getCurrentPosition(
        pos => {
          pendingData.lat = pos.coords.latitude;
          pendingData.lon = pos.coords.longitude;
          // עדכן הודעה — המיקום נמצא
          addMsg("bot", fmt(`✅ מיקום נוכחי נמצא (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}).\n**לאן את רוצה להגיע?**`));
        },
        () => {
          pendingFlow = "route_plan_manual";
          addMsg("bot", fmt("⚠️ לא הצלחתי לאתר מיקום אוטומטי. הזיני: **מאיפה לאיפה** תרצי לנסוע."));
        },
        { timeout: 8000 }
      );
    }
  }

  document.getElementById("inp").focus();
}

// בנה שאילתה טבעית מהפלואו + תשובת המשתמש
function buildFlowQuery(flow, data, userText) {
  switch (flow) {
    case "address_buses":
      return `אילו אוטובוסים עוברים ליד ${userText}? מה הקווים הקרובים לכתובת הזו?`;
    case "dan_line":
      return userText.match(/כל|רשימ/)
        ? "מה כל הקווים של חברת דן בגוש דן?"
        : `מה מסלול קו ${userText} של חברת דן? מה התחנות שלו?`;
    case "nta_line":
      return userText.match(/כל|רשימ/)
        ? "מה כל הקווים של NTA מטרופולין בגוש דן?"
        : `מה מסלול קו ${userText} של NTA מטרופולין? מה התחנות שלו?`;
    case "egged_line":
      return userText.match(/כל|רשימ/)
        ? "מה כל הקווים של אגד בגוש דן?"
        : `מה מסלול קו ${userText} של אגד? מה התחנות שלו?`;
    case "train_ta_merkaz":
      return `מתי הרכבות מתחנת תל אביב מרכז — ${userText}?`;
    case "train_ta_shalom":
      return `מתי הרכבות מתחנת תל אביב השלום — ${userText}?`;
    case "train_station":
      return `מה הרכבות בתחנת ${userText}? מתי הרכבת הבאה?`;
    case "travel_time":
      return `כמה זמן לוקח לנסוע ${userText} באוטובוס? ואיזה קווים יש?`;
    case "operators_list":
      return userText.match(/כל|רשימ|מפעיל/)
        ? "מה כל מפעילי האוטובוסים בגוש דן?"
        : `ספרי לי על המפעיל ${userText} — אילו קווים יש להם?`;
    case "route_plan":
      if (data.lat) {
        return `אני נמצאת ב-${data.lat.toFixed(4)},${data.lon.toFixed(4)}. אני רוצה להגיע ל: ${userText}. אילו קווי אוטובוס או רכבת יקחו אותי לשם? מה המסלול המומלץ?`;
      }
      return `אני רוצה להגיע ל-${userText}. אילו קווי תחבורה ציבורית יש?`;
    case "route_plan_manual":
      return `אני רוצה לנסוע ${userText} בתחבורה ציבורית. אילו קווים מומלצים?`;
    default:
      return userText;
  }
}

// הוסף שאלה לרשימה המהירה
function addToQuickList(q) {
  if (recentQs.includes(q)) return;
  recentQs.unshift(q);
  if (recentQs.length > 5) recentQs.pop();
  renderRecentQs();
}

function renderRecentQs() {
  const list = document.getElementById("qlist");
  // הסר שאלות אחרונות קיימות
  document.querySelectorAll(".recent-q").forEach(el => el.remove());
  document.querySelector(".recent-divider")?.remove();
  document.querySelector(".recent-section")?.remove();

  if (!recentQs.length) return;

  // הוסף בראש הרשימה
  const firstItem = list.querySelector(".q-section");
  const div = document.createElement("div");
  div.className = "recent-section q-section";
  div.textContent = "⟳ אחרונות";
  list.insertBefore(div, firstItem);

  recentQs.forEach(q => {
    const btn = document.createElement("button");
    btn.className = "q-item recent-q";
    btn.innerHTML = `<span class="q-ico">💬</span>${q.substring(0,32)}${q.length>32?"...":""}`;
    btn.onclick = () => ask(q);
    list.insertBefore(btn, firstItem);
  });

  const divider = document.createElement("div");
  divider.className = "q-divider recent-divider";
  list.insertBefore(divider, firstItem);
}

// ── Tool data ────────────────────────────────────────────
async function fetchToolData(userMsg, lastBot) {
  const combined = (userMsg + " " + lastBot).toLowerCase();

  try {
    // כתובת
    if (combined.match(/רחוב|כתובת|ליד|קרוב/)) {
      const geo = await fetch(`/geocode?q=${encodeURIComponent(userMsg+", גוש דן ישראל")}`).then(r=>r.json()).catch(()=>null);
      if (geo?.lat) {
        if (gtfsOk) {
          const near = await fetch(`${GTFS}/nearby?lat=${geo.lat}&lon=${geo.lon}&radius=400`).then(r=>r.json()).catch(()=>null);
          if (near?.stops?.length) {
            const lines = {};
            near.stops.forEach(s => (s.routes||[]).forEach(r => {
              lines[r.route_short_name] = `קו ${r.route_short_name} (${r.agency_name||""}) — ${s.stop_name} (${s.distance_m}מ')`;
            }));
            return `כתובת: ${geo.display_name?.split(",").slice(0,2).join(",")}\nקווים ב-400מ':\n${Object.values(lines).join("\n")||"לא נמצאו"}`;
          }
        }
        return `כתובת: ${geo.display_name?.split(",").slice(0,2).join(",")}`;
      }
    }

    // מפעיל
    const opMap = {"דן":"3","אגד תעבורה":"15","אגד":"5","nta":"6","מטרופולין":"6","סופרבוס":"18","קווים":"21","נתיב":"25","תנופה":"16"};
    for (const [name,id] of Object.entries(opMap)) {
      if (combined.includes(name) && gtfsOk) {
        const data = await fetch(`${GTFS}/routes?operator_id=${id}&limit=150`).then(r=>r.json()).catch(()=>null);
        if (data?.routes?.length) {
          const nums = [...new Set(data.routes.map(r=>r.route_short_name).filter(Boolean))].join(", ");
          return `מפעיל: ${data.routes[0]?.agency_name||name}\nסה"כ ${data.routes.length} קווים\nמספרים: ${nums}`;
        }
      }
    }

    // קו
    const lineNum = combined.match(/קו\s*(\d+)/)?.[1];
    if (lineNum && gtfsOk) {
      const data = await fetch(`${GTFS}/route_stops?short_name=${lineNum}`).then(r=>r.json()).catch(()=>null);
      if (data?.stops?.length) {
        const rr = await fetch(`${GTFS}/routes?q=${lineNum}&limit=1`).then(r=>r.json()).catch(()=>({}));
        const route = rr?.routes?.[0];
        return `קו ${lineNum}${route?.route_long_name?" — "+route.route_long_name:""}\nמפעיל: ${route?.agency_name||"?"}\n${data.stops.length} תחנות:\n${data.stops.map((s,i)=>`${i+1}. ${s.stop_name}`).join("\n")}`;
      }
    }

    // רכבת
    const stMap = {"מרכז":"3600","סבידור":"3700","השלום":"3500","הגנה":"3300","אוניברסיטה":"3100","בני ברק":"4690","פתח תקווה":"4480"};
    for (const [name,id] of Object.entries(stMap)) {
      if (combined.includes(name) && combined.includes("רכבת") && gtfsOk) {
        const now = new Date();
        const t = now.toTimeString().substring(0,8);
        const data = await fetch(`${GTFS}/schedule?stop_id=${id}&from=${t}`).then(r=>r.json()).catch(()=>null);
        if (data?.schedule?.length) {
          return `לוח זמנים — ${name}:\n${data.schedule.slice(0,8).map(s=>`${s.arrival_time?.substring(0,5)} קו ${s.route_short_name}: ${s.trip_headsign||""}`).join("\n")}`;
        }
      }
    }
  } catch(e) { console.warn("Tool:", e.message); }
  return null;
}

// ── UI ───────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") }
function fmt(t){
  return esc(t)
    .replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.*?)\*/g,"<em>$1</em>")
    .replace(/\n/g,"<br>");
}

function addMsg(role,html){
  document.getElementById("welcome")?.remove();
  const div=document.createElement("div");
  div.className=`msg ${role}`;
  div.innerHTML=`<div class="avatar">${role==="user"?"👤":"🤖"}</div><div class="bubble">${html}</div>`;
  document.getElementById("chat").appendChild(div);
  setTimeout(()=>{ document.getElementById("chat").scrollTop=9999; },50);
  return div;
}
function addTyping(){ return addMsg("bot",`<div class="typing"><span></span><span></span><span></span></div>`); }

// ── Send ─────────────────────────────────────────────────
function ask(text){ document.getElementById("inp").value=text; sendMsg(); }

async function sendMsg(){
  const inp=document.getElementById("inp");
  const text=inp.value.trim();
  if(!text||busy) return;

  inp.value=""; inp.style.height="auto";
  busy=true; document.getElementById("sbtn").disabled=true;

  // הצג את מה שהמשתמשת כתבה
  addMsg("user", esc(text));
  addToQuickList(text);

  // אם יש פלואו פתוח — בנה שאילתה מלאה מהתשובה
  let queryText = text;
  if (pendingFlow) {
    queryText = buildFlowQuery(pendingFlow, pendingData, text);
    pendingFlow = null;
    pendingData = {};
  }

  history.push({role:"user", content:queryText});
  if(history.length>24) history=history.slice(-24);

  const typing=addTyping();

  // שלב 1: נתונים (עם השאילתה המועשרת)
  const lastBot = history.filter(m=>m.role==="assistant").slice(-1)[0]?.content||"";
  const toolData = await fetchToolData(queryText, lastBot);

  // שלב 2: קרא ל-/ask עם timeout של 20 שניות
  const controller = new AbortController();
  const timeoutId  = setTimeout(() => controller.abort(), 30000);
  try {
    const resp = await fetch("/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: controller.signal,
      body: JSON.stringify({
        messages:  history.slice(-12),
        tool_data: toolData || "",
      }),
    });
    clearTimeout(timeoutId);

    const data = await resp.json().catch(()=>({}));
    if(!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

    const reply = data.reply || "לא התקבלה תשובה";
    history.push({role:"assistant", content:reply});
    if(history.length>24) history=history.slice(-24);

    typing.remove();
    const msgEl = addMsg("bot", fmt(reply));
    // הצג איזה מנוע ענה (Gemini / Ollama) בתחתית הבועה
    if(data.source){
      const src = document.createElement("div");
      src.style.cssText="font-size:.65rem;color:var(--text3);margin-top:5px;text-align:left";
      src.textContent = data.source === "gemini" ? "⚡ Gemini" : "🖥️ Ollama";
      msgEl.querySelector(".bubble").appendChild(src);
    }

  } catch(e){
    clearTimeout(timeoutId);
    typing.remove();
    const isAbort   = e.name === "AbortError";
    const isOffline = e.message.includes("Failed to fetch") || e.message.includes("NetworkError");
    let hint = "";
    if(isAbort)        hint = "⏱️ הבקשה ארכה יותר מ-20 שניות. ודאי ש-bot.py רץ ו-GEMINI_API_KEY מוגדר ב-.env";
    else if(isOffline) hint = "🔌 לא ניתן להתחבר ל-bot.py — הפעילי אותו: <code>python bot.py</code>";
    else if(e.message.includes("GEMINI_API_KEY")) hint = "🔑 הוסיפי GEMINI_API_KEY ב-.env ואתחלי את bot.py";
    else               hint = `ודאי ש-GEMINI_API_KEY מוגדר ב-.env`;
    addMsg("bot",`<div class="err">⚠️ ${esc(isAbort ? "timeout — לא התקבלה תשובה" : e.message)}</div><div style="font-size:.8rem;color:var(--text3);margin-top:6px">${hint}</div>`);
  }

  busy=false; document.getElementById("sbtn").disabled=false; inp.focus();
}
</script>
